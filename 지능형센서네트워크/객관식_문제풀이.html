<title>지능형센서네트워크 문제은행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: single study column; lecture "channel" selector on top, one question card, progress strip as a signal meter */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5b6874;
  --line: #d9dfe4;
  --accent: #0b6e8a;
  --accent-soft: #e1f0f4;
  --good: #1f7a4d;
  --good-soft: #e3f3ea;
  --bad: #b3362b;
  --bad-soft: #f8e6e3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151a; --surface: #172028; --fg: #e4eaee; --muted: #93a1ad; --line: #2a3742;
    --accent: #4fb6d3; --accent-soft: #15313b; --good: #5cc48e; --good-soft: #15302a;
    --bad: #ec7a6f; --bad-soft: #3a1f1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151a; --surface: #172028; --fg: #e4eaee; --muted: #93a1ad; --line: #2a3742;
  --accent: #4fb6d3; --accent-soft: #15313b; --good: #5cc48e; --good-soft: #15302a;
  --bad: #ec7a6f; --bad-soft: #3a1f1d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }

.panel { display: flex; flex-direction: column; gap: 10px; }
.label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .n { color: var(--surface); opacity: .8; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }

.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { display: flex; gap: 2px; height: 10px; }
.bars span { flex: 1; background: var(--line); border-radius: 1px; min-width: 0; }
.bars span.ok { background: var(--good); }
.bars span.no { background: var(--bad); }
.bars span.cur { background: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.qtext { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.55; white-space: pre-line; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  font: inherit; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
  padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.key { font-family: var(--font-mono); font-size: 13px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.explain { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.explain p { margin: 0; color: var(--fg); }
.nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.result { display: flex; flex-direction: column; gap: 16px; }
.score { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.score small { font-size: 16px; font-weight: 500; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; }
.review { display: flex; flex-direction: column; gap: 12px; }
.review-item { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.review-item .q { font-weight: 600; white-space: pre-line; }
.review-item .mine { color: var(--bad); }
.review-item .ans { color: var(--good); }
.review-item .why { color: var(--muted); }
footer { font-size: 13px; color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
@media (max-width: 480px) { .card { padding: 16px; } .qtext { font-size: 17px; } h1 { font-size: 22px; } }
</style>

<div class="wrap">

    <span class="eyebrow">Intelligent Sensor Networks · 객관식</span>
    <h1>지능형센서네트워크 문제은행</h1>

</div>

<script>
const LECTURES = [{"id": "L1", "short": "1강 Introduction", "title": "Lecture 1 · 센서 네트워크 개요", "questions": [{"q": "강의에서 설명한 일반 센서(conventional sensor)와 지능형 센서(intelligent sensor)의 차이로 옳은 것은?", "options": ["지능형 센서는 센싱 기능에 추가적인 처리 및 통신 기능을 결합한다", "지능형 센서는 반드시 인공지능(AI)이나 머신러닝(ML)을 포함해야 한다", "일반 센서는 처리된 정보를 출력하고 지능형 센서는 원시 신호만 출력한다", "일반 센서는 보정(calibration)과 진단(diagnostics)을 기본적으로 지원한다"], "answer": 0, "explanation": "지능형 센서는 센싱에 처리·통신 기능을 결합한 것이며, 강의에서는 '지능형'이 반드시 AI/ML을 의미하지는 않는다고 강조한다."}, {"q": "강의에서 제시한 지능형 센서 노드(Intelligent Sensor Node)의 구성 공식으로 옳은 것은?", "options": ["Sensor + Actuator + Controller → Intelligent Sensor Node", "Sensor + ADC + Display → Intelligent Sensor Node", "Sensor + Processing + Memory + Communication → Intelligent Sensor Node", "Sensor + Battery + GPS → Intelligent Sensor Node"], "answer": 2, "explanation": "강의는 센서에 처리, 메모리, 통신이 더해져 지능형 센서 노드가 된다고 정리한다."}, {"q": "하나의 센서만으로는 부족하여 센서 네트워크가 필요한 이유로 강의 내용과 가장 거리가 먼 것은?", "options": ["하나의 센서는 제한된 위치나 현상만 관찰할 수 있다", "센서 네트워크는 모든 노드가 유선으로 연결되어야 신뢰성이 높다", "여러 센서로 구성된 네트워크는 넓고 복잡한 환경을 모니터링할 수 있다", "무선 통신은 유선 인프라 구축이 어려운 환경에서 배치를 가능하게 한다"], "answer": 1, "explanation": "강의는 무선 통신이 유선 인프라가 어렵거나 불가능한 곳에서 배치를 가능하게 한다고 설명하며, 유선 연결을 필수로 보지 않는다."}, {"q": "작고 저렴하며 저전력인 센서 노드를 실용화한 기술 발전으로 강의에서 언급되지 않은 것은?", "options": ["초고밀도 집적회로(VLSI)", "미세전자기계시스템(MEMS)", "저전력 프로세서 및 무선 장치", "광섬유 기반 유선 백본(optical fiber backbone)"], "answer": 3, "explanation": "강의에서 언급된 기술은 VLSI, MEMS, 임베디드 컴퓨팅, 무선 통신, 전자 장치 소형화, 저전력 프로세서 및 무선 장치이다."}, {"q": "센서(sensor), 변환기(transducer), 액추에이터(actuator)의 정의를 올바르게 짝지은 것은?", "options": ["센서: 제어 신호를 물리적 동작으로 변환", "변환기: 물리적 매개변수를 측정 가능한 신호로만 변환", "액추에이터: 제어 신호를 물리적 동작으로 변환", "액추에이터: 에너지를 한 형태에서 다른 형태로 저장"], "answer": 2, "explanation": "액추에이터는 제어 신호를 물리적 동작으로(전기 → 물리), 센서는 물리적 현상을 측정 가능한 신호로, 변환기는 에너지를 한 형태에서 다른 형태로 변환한다."}, {"q": "물리적 현상이 디지털 데이터로 변환되는 과정의 올바른 순서는?", "options": ["물리적 현상 → 센서 → 신호 조정 → ADC → 디지털 처리", "물리적 현상 → ADC → 센서 → 신호 조정 → 디지털 처리", "물리적 현상 → 신호 조정 → 센서 → ADC → 디지털 처리", "물리적 현상 → 센서 → ADC → 디지털 처리 → 신호 조정"], "answer": 0, "explanation": "센서가 먼저 전기 신호를 만들고, 신호 조정 후 ADC가 아날로그 신호를 디지털 데이터로 변환하여 디지털 처리가 이루어진다."}, {"q": "신호 조정(signal conditioning)에 포함될 수 있는 작업으로 강의에서 언급되지 않은 것은?", "options": ["약한 신호 증폭(amplifying)", "잡음 제거(filtering noise)", "전압 범위 조정(adjusting the voltage range)", "데이터 암호화(encryption)"], "answer": 3, "explanation": "신호 조정에는 증폭, 잡음 필터링, 전압 범위 조정, 필요 시 신호 형태 변환이 포함되며 암호화는 언급되지 않았다."}, {"q": "스마트 실내 온도 제어 예에서 폐쇄 제어 루프(closed control loop)를 구성할 때, 히터/에어컨의 역할은?", "options": ["센서: 환경을 관찰한다", "액추에이터: 물리적 환경을 변화시킨다", "제어기: 의사결정을 수행한다", "베이스 스테이션: 데이터를 저장한다"], "answer": 1, "explanation": "실내 온도 → 온도 센서 → 제어기 → 히터/에어컨의 루프에서 히터/에어컨은 물리적 환경을 변화시키는 액추에이터이다."}, {"q": "측정 대상(물리량)과 센서 예의 연결이 옳지 않은 것은?", "options": ["온도 – 서미스터, 열전대(thermocouple)", "동작 – 포토다이오드, 기압계(barometer)", "화학 – pH 센서, 가스 센서", "위치 – GPS, 초음파 센서"], "answer": 1, "explanation": "동작(motion) 센서의 예는 가속도계와 자이로스코프이며, 포토다이오드는 광학, 기압계는 압력 센서의 예이다."}, {"q": "능동 센서(active sensor)와 수동 센서(passive sensor)에 대한 설명으로 옳은 것은?", "options": ["능동 센서는 환경에 이미 존재하는 에너지만 감지한다", "수동 센서는 반드시 외부 전원으로 빛이나 전자기파를 방출해야 한다", "PIR 센서는 적외선을 방출하고 반사파를 측정하는 능동 센서이다", "능동 센서는 외부 전원이 필요하며 빛, 소리, 전자기파 등의 에너지를 방출할 수 있다"], "answer": 3, "explanation": "능동 센서는 여기(excitation)를 위한 외부 전원이 필요하고 에너지를 방출해 환경 반응을 측정하며, PIR 센서는 따뜻한 물체의 적외선 변화를 감지하는 수동 센서이다."}, {"q": "센서 동작 원리와 전기적으로 변하는 양의 연결이 옳은 것은?", "options": ["압전형(piezoelectric) – 전하/전압", "정전용량형(capacitive) – 인덕턴스", "유도형(inductive) – 저항", "저항형(resistive) – 정전용량"], "answer": 0, "explanation": "저항형은 저항, 정전용량형은 정전용량, 유도형은 인덕턴스/자기장, 압전형은 전하/전압이 변한다."}, {"q": "도체의 저항은 R = lρ/A 이다. 길이(l)를 2배로 늘리고 단면적(A)도 2배로 늘리면, 비저항(ρ)이 같을 때 저항 R은 어떻게 되는가?", "options": ["2배가 된다", "4배가 된다", "변하지 않는다", "1/2이 된다"], "answer": 2, "explanation": "R은 l에 비례하고 A에 반비례하므로 l과 A를 모두 2배로 하면 2/2 = 1, 즉 저항은 변하지 않는다."}, {"q": "휘트스톤 브리지(Wheatstone bridge)에서 R1 = 100Ω, R2 = 200Ω, R3 = 50Ω일 때, 균형 조건 R2/R1 = Rx/R3 를 만족하는 Rx는?", "options": ["25Ω", "50Ω", "200Ω", "100Ω"], "answer": 3, "explanation": "R2/R1 = 200/100 = 2 이므로 Rx = 2 × R3 = 2 × 50 = 100Ω이며, 이때 출력 전압 VOUT = 0이 된다."}, {"q": "휘트스톤 브리지에 대한 설명으로 옳은 것은?", "options": ["균형 상태에서 출력 전압 VOUT은 공급 전압 VCC와 같다", "Rx가 변하면 브리지의 평형이 깨지고 출력 전압이 발생하므로 저항 변화를 측정할 수 있다", "R1, R2, R3는 모두 미지의 가변 저항이다", "휘트스톤 브리지는 전압 변화를 저항 변화로 변환하는 회로이다"], "answer": 1, "explanation": "휘트스톤 브리지는 저항 변화를 측정 가능한 전압으로 변환하며, 균형 시 VOUT = 0이고 Rx가 변하면 VOUT이 변한다."}, {"q": "정전용량 C = εA/d 에서 다른 조건은 그대로 두고 전극 사이의 거리(d)를 절반으로 줄이면 정전용량은 어떻게 되는가?", "options": ["2배가 된다", "1/2이 된다", "4배가 된다", "변하지 않는다"], "answer": 0, "explanation": "C는 d에 반비례하므로 d가 1/2이 되면 C는 2배가 된다."}, {"q": "압전 센서(piezoelectric sensor)에 대한 설명으로 옳은 것은?", "options": ["자기장의 변화를 감지하여 금속 근접을 검출한다", "온도에 따른 비저항 변화를 이용한다", "기계적 변형이 전하 이동을 발생시키며 압력, 힘, 변형률, 가속도 측정에 사용된다", "유전율 변화를 이용하여 습도를 측정한다"], "answer": 2, "explanation": "압전 센서는 기계적 힘 → 변형 → 전기 신호의 원리로 동작하며 압력, 힘, 변형률, 가속도 측정에 사용된다."}, {"q": "무선 센서 노드(wireless sensor node)의 일반적인 구성 요소로 강의에서 언급되지 않은 것은?", "options": ["센싱 장치(sensing unit)", "고해상도 디스플레이 장치(display unit)", "무선 통신 장치(wireless communication unit)", "전원 공급 장치(power supply)"], "answer": 1, "explanation": "무선 센서 노드는 센싱 장치, 처리 장치, 메모리/저장 장치, 무선 통신 장치, 전원 공급 장치로 구성된다."}, {"q": "무선 센서 네트워크(WSN)의 역사에 관한 연결로 옳은 것은?", "options": ["Smart Dust 프로젝트 – UCLA와 Rockwell, 1996년", "WINS 프로젝트 – UC Berkeley, 1999년, 모래알 크기의 모트(mote)", "PicoRadio 프로젝트 – DARPA, 1978년 워크숍", "1978년 DARPA 분산 센서 네트워크 워크숍 – 네트워킹, 신호 처리, 분산 알고리즘 연구"], "answer": 3, "explanation": "1978년 DARPA 워크숍은 군사적 기원에 해당하며, WINS는 UCLA+Rockwell(1996), Smart Dust는 UC Berkeley(1999), PicoRadio는 Berkeley BWRC(2000)이다."}, {"q": "IEEE 802.15.4(LR-WPAN)에 대한 설명으로 옳은 것은?", "options": ["단거리, 저속, 저전력 통신을 위해 설계되었으며 ZigBee, WirelessHART, Thread 등이 그 예이다", "멀티미디어 전송을 위한 높은 대역폭이 주된 장점이다", "1997년에 도입되어 2.4/5/6 GHz 대역을 사용하는 Wi-Fi 표준이다", "에너지 오버헤드가 커서 저전력 WSN에 부적합하다"], "answer": 0, "explanation": "IEEE 802.15.4는 자원 제약이 있는 저전력·단거리 WSN에 적합하며, 높은 대역폭과 큰 에너지 소모는 IEEE 802.11(Wi-Fi)의 특징이다."}, {"q": "스타 토폴로지(star topology)와 메시 토폴로지(mesh topology)에 대한 설명으로 옳지 않은 것은?", "options": ["스타 토폴로지에서는 각 노드가 기지국과 직접 통신한다", "메시 토폴로지에서는 노드들이 서로의 데이터를 중계한다", "스타 토폴로지는 단일 홉 구조로, 대규모 배치에 가장 적합하다", "메시 토폴로지의 과제로 라우팅, 데이터 집계, 중복 제거가 있다"], "answer": 2, "explanation": "스타 토폴로지는 효율적이지만 범위가 제한적이며, 대규모 배치를 지원하는 것은 메시(멀티홉) 토폴로지이다."}, {"q": "수신 전력이 Pr ∝ Pt/d² 를 따른다고 할 때, 송신 전력이 같고 거리가 3배로 늘어나면 수신 전력은 약 몇 배가 되는가?", "options": ["1/3", "3배", "1/6", "1/9"], "answer": 3, "explanation": "역제곱 모델에서 수신 전력은 거리의 제곱에 반비례하므로 거리가 3배이면 1/3² = 1/9이 된다."}, {"q": "센서 노드의 CMOS 프로세서 에너지 소비에 대한 설명으로 옳은 것은?", "options": ["스위칭 에너지는 공급 전압(Vdd)의 제곱에 비례하므로 공급 전압을 조금만 낮춰도 스위칭 에너지를 크게 줄일 수 있다", "누설 에너지는 트랜지스터가 스위칭할 때만 소비된다", "반도체 공정이 미세화될수록 누설 에너지의 비중은 항상 감소한다", "스위칭 에너지는 공급 전압에 반비례한다"], "answer": 0, "explanation": "Eswitch ∝ Vdd² 이므로 전압 감소가 효과적이며(DVS의 근거), 누설 에너지는 스위칭하지 않을 때도 소비되고 공정 미세화로 비중이 커질 수 있다."}, {"q": "'연산에 에너지 사용 → 통신 에너지 절감(Spend Energy Computing → Save Energy Communicating)' 관점에서, 1,000개의 원시 측정값을 보내는 대신 가장 적절한 방식은?", "options": ["1,000개 값을 모두 그대로 더 높은 송신 전력으로 전송한다", "로컬에서 평균을 계산하여 하나의 값만 전송한다", "Wi-Fi(IEEE 802.11)로 전환하여 원시 데이터를 빠르게 전송한다", "데이터를 저장만 하고 전송하지 않는다"], "answer": 1, "explanation": "로컬 처리(집계, 중복 제거, 융합, 로컬 분석)는 전송할 데이터 양을 줄여 통신 에너지를 절감할 수 있다."}, {"q": "재난 지역에 항공기로 투하된 센서 노드가 이웃 노드와 통신을 설정하고, 위치를 파악하며, 센싱 기능을 시작하는 것은 어떤 자율 관리 능력에 해당하는가?", "options": ["자기 보호(self-protection)", "자가 복구(self-healing)", "자기 구성(self-configuration)", "자기 최적화(self-optimization)"], "answer": 2, "explanation": "애드혹 배치(ad hoc deployment)에서 생존한 노드가 이웃 통신 설정, 위치 파악, 센싱 시작을 수행하는 것은 자기 구성 작업이다."}, {"q": "중앙집중식 라우팅과 분산형 라우팅, 그리고 기존 네트워크와 WSN의 비교에 관한 설명으로 옳은 것은?", "options": ["중앙집중식 라우팅은 오버헤드가 작고 확장성이 높다", "분산형 라우팅은 항상 최적 경로를 보장한다", "WSN은 일반적으로 범용 설계이며 배치가 항상 계획된다", "분산형 라우팅은 이웃 정보만 사용해 경로가 최적이 아닐 수 있지만 관리 오버헤드를 줄인다"], "answer": 3, "explanation": "분산 알고리즘은 항상 최적은 아니지만 에너지 효율적이며 관리 오버헤드를 줄이고, WSN은 주로 특정 응용 목적이며 비계획적 배치가 가능하다."}]}, {"id": "L2", "short": "2강 Application", "title": "Lecture 2 · 응용 분야", "questions": [{"q": "다음 중 센서가 게이트웨이와 직접 통신하는 단순/단일 홉(single-hop) 응용 분야의 예로 강의에서 제시된 것은?", "options": ["환경 모니터링 (Environmental monitoring)", "스마트 계량 (Smart metering)", "지하 광산 (Underground mines)", "재난 및 군사 모니터링 (Disaster and military monitoring)"], "answer": 1, "explanation": "단일 홉 응용으로는 홈 자동화, 건물 모니터링, 스마트 계량, 제한된 지역의 헬스케어가 제시되었다. 나머지는 다중 홉 응용의 예이다."}, {"q": "복잡/다중 홉(multi-hop) WSN 응용 분야의 특징으로 옳은 것은?", "options": ["모든 센서가 반드시 게이트웨이와 직접 통신한다.", "제한된 실내 공간에서만 사용된다.", "노드가 다른 노드를 통해 정보를 중계할 수 있다.", "유선 케이블로 중앙 장치에 연결된다."], "answer": 2, "explanation": "다중 홉 응용(환경·구조물 모니터링, 농업, 지하 광산 등)에서는 노드가 다른 노드를 통해 정보를 중계할 수 있다."}, {"q": "강의에서 제시한 일반적인 WSN 응용 워크플로(workflow)의 순서로 옳은 것은?", "options": ["센서 → 물리적 현상 → 무선 통신 → 로컬 처리 → 조치 → 싱크/게이트웨이 → 분석/의사결정", "물리적 현상 → 센서 → 싱크/게이트웨이 → 로컬 처리 → 무선 통신 → 조치 → 분석/의사결정", "물리적 현상 → 로컬 처리 → 센서 → 분석/의사결정 → 무선 통신 → 싱크/게이트웨이 → 조치", "물리적 현상 → 센서 → 로컬 처리 → 무선 통신 → 싱크/게이트웨이 → 분석/의사결정 → 조치"], "answer": 3, "explanation": "일반적 워크플로는 물리적 현상 → 센서 → 로컬 처리 → 무선 통신 → 싱크/게이트웨이 → 분석/의사결정 → 조치(Action) 순이다."}, {"q": "교통 제어 워크플로 예시에서 차량이 교차로에 접근했을 때 최종적으로 수행되는 조치(Action)는?", "options": ["녹색 신호 시간이 조정된다.", "차량 번호판이 자동으로 발급된다.", "관개 시스템이 작동한다.", "교량 점검이 실시된다."], "answer": 0, "explanation": "자기 센서가 차량을 감지하고 노변 게이트웨이가 데이터를 전송하면, 교통 관제 센터가 교통량을 분석하여 녹색 신호 시간을 조정한다."}, {"q": "2007년 8월 미네소타 고속도로 다리 붕괴 사고에 대해 미국 교통안전위원회(NTSB)가 제시한 세 가지 잠정적 원인에 해당하지 않는 것은?", "options": ["마모 (wear and tear)", "날씨 (weather)", "인근 공사 프로젝트의 하중 (weight of a nearby construction project)", "지진 (earthquake)"], "answer": 3, "explanation": "NTSB는 정확한 원인을 밝히지 못했으나 마모, 날씨, 인근 공사로 인한 하중 세 가지를 잠정적 원인으로 제시했다. 지진은 포함되지 않는다."}, {"q": "전통적인 다리 점검 방식에서 정밀 점검(detailed inspection)의 수행 주기로 옳은 것은?", "options": ["매일", "연 1회 정도", "최소 5년에 한 번", "필요할 때만"], "answer": 2, "explanation": "육안 점검은 매일, 기본 점검은 연 1회 정도, 정밀 점검은 최소 5년마다, 특별 점검은 필요 시 고도의 전문가가 수행한다."}, {"q": "전역 점검 기법(global inspection)에서 분석하는 모달 파라미터(modal parameters)에 해당하지 않는 것은?", "options": ["고유 주파수 (natural frequency)", "감쇠 비율 (damping ratio)", "모드 형상 (mode shape)", "인덕턴스 (inductance)"], "answer": 3, "explanation": "전역 기법은 자연(고유) 주파수, 감쇠 비율, 모드 형상 등의 모달 파라미터를 분석한다. 인덕턴스는 교통 제어의 유도 루프와 관련된 개념이다."}, {"q": "구조물 건강 모니터링(SHM)에서 WSN이 갖는 세 가지 장점에 해당하지 않는 것은?", "options": ["초음파·X-선 영상을 이용해 작은 균열을 직접 탐지할 수 있다.", "유선 장치가 닿을 수 없는 구역에 센서 노드를 설치할 수 있다.", "다수 노드의 측정값 간 상관관계를 이용해 손상 위치를 파악할 수 있다.", "정상 운영을 방해하지 않고 배치 및 유지보수가 가능하다."], "answer": 0, "explanation": "초음파·X-선 등으로 작은 균열을 탐지하는 것은 국소 점검 기법(local techniques)의 특징이며, 시간이 많이 들고 정상 운영을 방해한다."}, {"q": "골든게이트교(Golden Gate Bridge) 배치에서 주변 진동을 1 kHz로 동기 샘플링했다. 이때 샘플 간 시간 간격은?", "options": ["10 µs", "1 ms", "1 s", "30 µs"], "answer": 1, "explanation": "1 kHz는 초당 1,000개의 샘플이므로 샘플 간격은 1/1000 s = 1 ms이다. 10 µs는 지터(jitter) 한계 값이다."}, {"q": "UC 버클리의 골든게이트교 WSN 프로토타입(Kim et al. 2007)에 대한 설명으로 옳은 것은?", "options": ["노드는 교량 하부 도로면에만 매설되었다.", "데이터는 단일 홉으로 게이트웨이에 전송되었다.", "데이터는 46홉 다중 홉 네트워크를 통해 안정적으로 전송되었다.", "목표는 교량 운영을 일시 중단하고 극한 하중 시험을 하는 것이었다."], "answer": 2, "explanation": "노드는 주 경간과 탑에 배치되었고, 데이터는 46홉 네트워크로 안정적으로 전송되었으며, 교량 운영을 방해하지 않고 응답을 측정하는 것이 목표였다."}, {"q": "교통 모니터링에서 도로변 카메라(roadside camera)의 한계로 강의에서 지적한 것은?", "options": ["안개, 스모그, 먼지, 눈, 비 상황에서 신뢰성이 낮다.", "차량의 존재를 전혀 감지할 수 없다.", "도로를 파손해야만 설치할 수 있다.", "최대 15 m까지만 감지할 수 있다."], "answer": 0, "explanation": "도로변 카메라는 안개·스모그·먼지·눈·비 상황에서 신뢰성이 낮으며, 이 때문에 날씨 의존도가 낮은 WSN이 대안으로 제시된다."}, {"q": "유도 루프(inductive loop) 두 개가 5 m 간격으로 매설되어 있고, 한 차량이 두 루프를 통과하는 시간차가 0.25초였다. 이 차량의 속도는?", "options": ["20 km/h", "72 km/h", "1.25 km/h", "45 km/h"], "answer": 1, "explanation": "속도는 알려진 거리만큼 떨어진 두 루프로 측정할 수 있다. 5 m ÷ 0.25 s = 20 m/s이고, 이는 72 km/h이다."}, {"q": "유도 루프(inductive loop)의 제한점으로 옳은 것은?", "options": ["날씨의 영향을 크게 받는다.", "차량의 크기를 전혀 추정할 수 없다.", "지구 자기장 변화만을 측정한다.", "설치 시 도로를 파손해야 하며, 밀집(bumper-to-bumper) 차량을 구분하기 어렵다."], "answer": 3, "explanation": "유도 루프는 날씨 영향이 적고 인덕턴스 변화로 차량의 존재·속도·크기를 알 수 있지만, 설치 시 도로를 파손해야 하고 밀집 차량 구분이 어렵다."}, {"q": "AMR(Anisotropic Magnetoresistive) 자기 센서에 대한 설명으로 옳은 것은?", "options": ["차량에 의해 변하는 지구 자기장을 측정하며, 최대 약 15 m 거리에서 탐지가 가능하다.", "도로 아래 매설된 코일에 흐르는 전류로 패러데이 법칙을 이용한다.", "모든 차량 종류가 동일한 자기 신호를 생성한다.", "영상 분석을 통해 차량 번호판을 인식한다."], "answer": 0, "explanation": "AMR 센서는 차량에 의한 지구 자기장 변화를 측정하며, 차량 종류마다 고유한 자기 신호가 생기고 최대 15 m에서 탐지, 차량을 쌍극자로 모델링할 수 있다."}, {"q": "MIT의 Knaian(2000) 도시 교통 모니터링 WSN 프로토타입에 대한 설명으로 옳은 것은?", "options": ["노드는 레이더 센서 12개로 구성되었다.", "4 MHz Atmel CPU와 TinyOS를 사용했다.", "노드는 AMR 자기 센서 2개와 온도 센서로 구성되었으며, 2 kHz로 샘플링했다.", "최대 15 mph 차량만 감지할 수 있었다."], "answer": 2, "explanation": "Knaian 프로토타입은 AMR 자기 센서 2개 + 온도 센서로 구성, 2 kHz 샘플링, 전·후 센서 시간차로 속도를 계산하며 최대 200 mph, 최소 간격 3 m 차량을 감지한다."}, {"q": "Arora et al.(2004)의 MacDill 공군기지 배치에서 총 90개의 Mica2 노드 중 78개가 자기 센서 노드였다. 레이더 노드는 몇 개인가?", "options": ["78개", "12개", "90개", "16개"], "answer": 1, "explanation": "90개 노드 중 자기 센서 78개를 제외하면 레이더 노드는 90 − 78 = 12개이다."}, {"q": "헬스케어 센서 분류에서 근전도(EMG) 센서가 주로 사용되는 응용 분야는?", "options": ["활력 징후 (Vital signs)", "낙상 감지 (Fall detection)", "파킨슨병 (Parkinson's disease)", "재활 (Rehabilitation)"], "answer": 3, "explanation": "근육(Muscular) 범주의 EMG는 재활에 사용된다. ECG·SpO₂·혈압·체온은 활력 징후, 가속도계·자이로스코프는 파킨슨병·낙상 감지에 사용된다."}, {"q": "2024년 1인당 보건의료 지출은 미국 약 15,474달러, 한국 약 4,797달러(PPP 기준)였다. 미국의 1인당 지출은 한국의 약 몇 배인가?", "options": ["약 3.2배", "약 2.1배", "약 5.3배", "약 1.5배"], "answer": 0, "explanation": "15,474 ÷ 4,797 ≈ 3.2이다. 강의는 높은 지출이 반드시 높은 품질이나 더 긴 기대수명을 보장하지 않는다고 지적한다."}, {"q": "파킨슨병 모니터링(Parkinson's Disease Monitoring) 프로토타입에 대한 설명으로 옳은 것은?", "options": ["눈 속에 이식된 마이크로 센서 배열로 시각을 보조한다.", "환자의 일상생활과 무관하게 병원 내에서만 사용된다.", "3D 가속도계 기반 착용형 시스템으로 운동 데이터를 기록하고, 뇌심부자극(DBS) 파라미터 조정을 지원한다.", "Shimmer 플랫폼은 가속도계 한 종류만 탑재한다."], "answer": 2, "explanation": "3D 가속도계 착용형 시스템이 운동 데이터를 기록해 인간 관찰을 대체하고 약물 용량 및 DBS 파라미터 조정을 지원한다. Shimmer는 가속도계·자이로·ECG·EMG 등 다양한 센서를 통합한다."}, {"q": "파이프라인 모니터링에서 누출 물질에 따른 열적 특성으로 옳은 것은?", "options": ["액체 누출과 가스 누출 모두 저온 지점을 형성한다.", "액체 누출은 고온 지점(hot spot)을, 가스 누출은 저온 지점(cold spot)을 형성한다.", "액체 누출은 저온 지점을, 가스 누출은 고온 지점을 형성한다.", "누출은 온도 변화를 일으키지 않는다."], "answer": 1, "explanation": "이송 물질의 특성 파악이 중요하며, 액체 누출은 고온 지점을, 가스 누출은 저온 지점을 형성한다."}, {"q": "PipeNet(도시 상수도 관로 모니터링) 프로토타입이 보여주는 핵심 특징으로 옳은 것은?", "options": ["원시 데이터를 처리 없이 모두 서버로 전송한다.", "하버드대가 에콰도르에서 개발했다.", "유선 DAQ만 사용하여 데이터를 수집한다.", "로컬 노드가 최솟값·최댓값·평균·표준편차를 계산해 게이트웨이로 보내는 로컬/네트워크 내 처리(in-network processing)를 보여준다."], "answer": 3, "explanation": "PipeNet은 임페리얼 칼리지 런던·인텔 리서치·MIT가 개발했으며, 압력·pH·하수 수위를 측정하고 로컬 노드가 통계값을 계산해 게이트웨이로 전송한다."}, {"q": "정밀 농업 기술 중 '수확량 매핑(Yield mapping)'에 대한 설명으로 옳은 것은?", "options": ["GPS와 수확량 모니터를 결합해 공간 데이터를 확보한다.", "잡초를 지도화해 선택적으로 살포한다.", "시간에 따른 염도를 추적·관리한다.", "살포·파종용 차량의 위치를 정밀 제어한다."], "answer": 0, "explanation": "수확량 매핑은 GPS와 수확량 모니터를 결합해 공간 데이터를 얻는다. 나머지는 각각 잡초 매핑, 염도 매핑, 유도 시스템에 대한 설명이다."}, {"q": "하버드대의 2005년 레벤타도르(Reventador) 화산 배치에 대한 설명으로 옳은 것은?", "options": ["마이크가 달린 3개의 무선 노드를 사용했다.", "46홉 네트워크로 교량 진동을 측정했다.", "3 km 선형 토폴로지에 16개의 지진·음향 센서 노드를 배치하여 3주 동안 230건 이상의 화산 활동을 포착했다.", "외부 전원과 헬기 지원이 반드시 필요했다."], "answer": 2, "explanation": "2005년 레벤타도르 배치는 16개 지진·음향(seismoacoustic) 노드, 3 km 선형 토폴로지로 3주간 230건 이상의 이벤트를 포착했다. 3개 마이크 노드는 2004년 퉁구라우아 배치이다."}, {"q": "지하 광산에서 WSN 배치 시 통신상의 어려움으로 강의에서 제시한 것은?", "options": ["지나치게 낮은 습도로 인한 정전기", "굴곡진 터널로 인한 가시선(line-of-sight) 부재와 강한 반사·굴절·산란, 높은 습도에 의한 신호 흡수·감쇠", "GPS 신호가 너무 강해 발생하는 간섭", "노드 밀도가 너무 높아 발생하는 공간 다양성 손실"], "answer": 1, "explanation": "지하 광산은 굴곡진 터널로 가시선 확보가 불가하고 반사·굴절·산란이 강하며, 높은 습도가 신호 흡수와 감쇠를 유발한다."}, {"q": "WSN 응용 분야 비교표에서 정밀 농업(Precision Agriculture)에 해당하는 네트워크와 핵심 요구사항의 조합으로 옳은 것은?", "options": ["WBAN/Wi-Fi — 정확성, 개인정보 보호 및 저전력", "도로변 WSN/IoT — 낮은 지연시간 및 넓은 커버리지", "지하 메시 네트워크 — 안전성, 신뢰성 및 연결성", "LoRaWAN/메시 네트워크 — 저전력 및 광역 커버리지"], "answer": 3, "explanation": "정밀 농업은 토양 수분·온도·습도 센서를 사용하며 LoRaWAN/메시 네트워크로 저전력 및 광역 커버리지를 요구한다. 나머지는 헬스케어, 교통, 광산의 조합이다."}]}, {"id": "L3", "short": "3강 Node Architecture", "title": "Lecture 3 · 노드 구조", "questions": [{"q": "센서 노드를 분류하는 6가지 주요 특성에 해당하지 않는 것은?", "options": ["이동성 (Mobility)", "가격 (Cost)", "전원 (Power)", "통신 방식 (Communication)"], "answer": 1, "explanation": "센서 노드는 크기, 이동성, 전원, 처리 능력, 센싱 방식, 통신 방식의 6가지 특성으로 분류된다. 가격은 분류 특성에 포함되지 않는다."}, {"q": "스마트 더스트(Smart Dust)에 대한 설명으로 옳은 것은?", "options": ["대형 고정형 노드를 상시 전원으로 운용하는 기술이다", "모트(mote)는 센싱 기능만 가지며 통신은 별도 게이트웨이가 담당한다", "환경을 적극적으로 변화시키며 측정하도록 설계되었다", "초기 프로젝트는 센싱, 연산, 통신, 전원 기능을 세제곱밀리미터 규모의 장치에 통합할 수 있는지 연구하였다"], "answer": 3, "explanation": "스마트 더스트는 모트라는 초소형 자율 센서 노드로 구성되며, 초기 프로젝트는 이 기능들을 세제곱밀리미터 규모에 통합할 수 있는지를 연구하였다. 또한 물리적 환경을 최소한으로 방해하며 모니터링하도록 설계된다."}, {"q": "무선 센서 노드의 하위 시스템 중 일반적으로 가장 많은 에너지를 소비하는 것은?", "options": ["통신 하위 시스템 (Communication subsystem)", "센싱 하위 시스템 (Sensing subsystem)", "처리 하위 시스템 (Processing subsystem)", "전력 하위 시스템 (Power subsystem)"], "answer": 0, "explanation": "통신은 일반적으로 가장 많은 에너지를 소비하므로, 트랜시버는 활성, 유휴, 절전 모드를 사용해 에너지를 절약한다."}, {"q": "수동 적외선 센서(PIR sensor)의 측정 대상과 응용 사례로 옳게 짝지은 것은?", "options": ["각속도와 회전 - 보행 및 동작 감지", "자기장 변화 - 차량 감지", "물체의 적외선 복사 - 사람의 움직임 감지", "혈중 산소 수치 - 환자 모니터링"], "answer": 2, "explanation": "PIR 센서는 물체의 적외선 복사를 측정하며 사람의 움직임 감지에 사용된다. 나머지는 각각 자이로스코프, 자기 센서, 산소포화도계에 해당한다."}, {"q": "어떤 센서 신호의 최고 주파수가 500 Hz일 때, 나이퀴스트 정리(Nyquist theorem)에 따른 최소 샘플링 주파수는?", "options": ["250 Hz", "500 Hz", "1000 Hz", "2000 Hz"], "answer": 2, "explanation": "나이퀴스트 정리에 따르면 샘플링 주파수는 신호 최고 주파수의 최소 두 배 이상이어야 하므로 500 Hz x 2 = 1000 Hz이다."}, {"q": "에일리어싱(Aliasing)에 대한 설명으로 옳은 것은?", "options": ["샘플링이 너무 느리면 고주파 신호가 잘못된 저주파 신호처럼 나타나는 현상", "실제 전압과 디지털로 표현된 전압의 차이", "각 샘플 전압을 가장 가까운 디지털 단계로 반올림하는 과정", "센서 출력 전압이 ADC 입력 범위를 넘어서는 현상"], "answer": 0, "explanation": "에일리어싱은 샘플링 속도가 너무 느릴 때 고주파 신호가 잘못된 저주파 신호처럼 보이는 현상이다. 두 번째 보기는 양자화 오차, 세 번째는 양자화에 대한 설명이다."}, {"q": "12비트 ADC가 가지는 디지털 단계(level)의 수는?", "options": ["1,024", "2,048", "8,192", "4,096"], "answer": 3, "explanation": "M비트 ADC는 2^M개의 디지털 단계를 가지므로 12비트 ADC는 2^12 = 4,096개 단계를 가진다."}, {"q": "Arduino Uno는 0~5 V 입력 범위에 내장 10비트 ADC를 사용한다. ADC 읽기값의 한 단계 변화가 의미하는 전압은 약 얼마인가?", "options": ["0.49 mV", "4.88 mV", "9.77 mV", "48.8 mV"], "answer": 1, "explanation": "Q = V_range / 2^M = 5 V / 1024 이므로 약 4.88 mV이다."}, {"q": "입력 전압 범위가 0~3.3 V인 12비트 ADC의 전압 분해능(Q, step size)은 약 얼마인가?", "options": ["0.81 mV", "3.22 mV", "1.61 mV", "8.06 mV"], "answer": 0, "explanation": "Q = V_range / 2^M = 3.3 V / 4096 이므로 약 0.81 mV이다."}, {"q": "아날로그 출력(A0)과 디지털 출력(D0)을 모두 제공하는 센서 모듈(예: 화염, 터치 모듈)에서 D0 출력에 대한 설명으로 옳은 것은?", "options": ["Arduino의 내장 ADC가 analogRead()로 변환해야 하는 연속 전압이다", "SPI 클록 신호로 사용된다", "모듈의 비교기(comparator)가 생성한 HIGH/LOW 신호이며, 파란색 가변저항으로 임계값을 설정한다", "모듈에 전원을 공급하는 핀이다"], "answer": 2, "explanation": "D0는 온보드 비교기에서 생성된 HIGH/LOW 신호를 제공하고 가변저항으로 임계값을 정한다. A0는 Arduino ADC로 변환되는 아날로그 전압을 제공한다."}, {"q": "프로세서 하위 시스템의 구성 요소 중 전원이 꺼져도 프로그램을 영구적으로 저장하는 것은?", "options": ["RAM", "클록 / 타이머 (Clock / Timer)", "GPIO", "플래시 메모리 (Flash Memory)"], "answer": 3, "explanation": "플래시 메모리는 전원이 꺼져도 프로그램을 저장한다. RAM은 실행 중 변수, 센서 측정값, 중간 결과를 임시로 저장한다."}, {"q": "폰 노이만 병목 현상(Von Neumann bottleneck)의 원인으로 옳은 것은?", "options": ["프로그램과 데이터 메모리가 분리되어 동기화가 어렵기 때문", "프로세서가 같은 메모리에서 같은 버스를 통해 명령어와 데이터를 가져오기 때문", "명령어 캐시가 너무 작기 때문", "DMA가 CPU 사이클을 과도하게 사용하기 때문"], "answer": 1, "explanation": "폰 노이만 구조는 프로그램과 데이터가 하나의 메모리와 하나의 버스를 공유하여, 각 전송마다 별도의 클록이 필요하므로 느려진다."}, {"q": "무선 센서 노드에서 SPI 통신 구조에 대한 설명으로 옳은 것은?", "options": ["슬레이브도 필요할 때 먼저 통신을 시작할 수 있다", "ADC는 데이터를 RAM에 직접 보낼 수 없고 마이크로컨트롤러를 거쳐야 한다", "구성 요소끼리 마이크로컨트롤러 없이 직접 통신할 수 있다", "기본적으로 무선 트랜시버가 마스터 역할을 한다"], "answer": 1, "explanation": "SPI는 항상 마스터-슬레이브 구조이며 통신은 마스터에서 시작된다. 센서 노드에서는 마이크로컨트롤러가 기본 마스터이므로 구성 요소끼리는 직접 통신할 수 없다."}, {"q": "슈퍼 하버드(SHARC) 아키텍처가 지원하는 DMA(Direct Memory Access)가 바람직한 이유로 옳은 것은?", "options": ["프로그램과 데이터를 하나의 버스로 통합할 수 있기 때문", "명령어 수를 줄여 메모리 용량을 절약하기 때문", "ADC 분해능을 높일 수 있기 때문", "CPU의 소중한 연산 사이클을 다른 작업에 활용할 수 있기 때문"], "answer": 3, "explanation": "DMA는 외부 장치가 메모리에 직접 데이터를 전송하게 하여 CPU 사이클을 확보하고, 칩 외부에서 프로그램/데이터 메모리 버스에 접근해 외부 메모리와 주변장치 연결을 지원한다."}, {"q": "I²C의 속도 모드 중 빠른 모드(Fast mode)의 전송 속도는?", "options": ["400 kbps", "100 kbps", "3.4 Mbps", "250 kbps"], "answer": 0, "explanation": "I²C 속도 모드는 표준 100 kbps, 빠른 모드 400 kbps, 고속 모드 3.4 Mbps이다."}, {"q": "FPGA(Field Programmable Gate Array)에 대한 설명으로 옳지 않은 것은?", "options": ["제조 후에도 내부 하드웨어 논리를 재구성할 수 있다", "Verilog나 VHDL 같은 하드웨어 기술 언어로 설계한다", "대부분의 FPGA에 ADC가 내장되어 있어 아날로그 센서를 바로 연결할 수 있다", "마이크로컨트롤러와 달리 여러 연산을 병렬로 수행할 수 있다"], "answer": 2, "explanation": "많은 FPGA에는 ADC가 내장되어 있지 않아 아날로그 센서는 외부 ADC가 필요한 경우가 많다."}, {"q": "IMote 노드 아키텍처에서 센서 연결 방식으로 옳은 것은?", "options": ["I²C는 저속 데이터 센서를, SPI는 고속 데이터 센서를 연결한다", "SPI는 저속 데이터 센서를, I²C는 고속 데이터 센서를 연결한다", "모든 센서를 UART로만 연결한다", "모든 센서를 CAN 버스로 연결한다"], "answer": 0, "explanation": "IMote에서는 I²C가 낮은 데이터율의 센서를, SPI가 높은 데이터율의 센서를 연결한다. 이는 SPI가 더 빠르고 I²C가 더 느리다는 특성과 일치한다."}, {"q": "XYZ 노드의 프로세서 하위 시스템에 대한 설명으로 옳은 것은?", "options": ["ATmega328P를 사용하며 최대 16 MHz로 동작한다", "ARM7TDMI MCU를 사용하며 최대 58 MHz, 32비트 또는 16비트 모드로 동작한다", "마이크로프로세서와 DSP를 결합하여 13~416 MHz 동적 전압 스케일링을 지원한다", "마이크로컨트롤러와 FPGA 두 개의 프로세서를 사용한다"], "answer": 1, "explanation": "XYZ 노드는 최대 58 MHz의 ARM7TDMI MCU를 사용하며 32비트 또는 16비트 모드로 동작한다. 세 번째는 IMote, 네 번째는 Hogthrob에 대한 설명이다."}, {"q": "Hogthrob 센서 노드에 대한 설명으로 옳은 것은?", "options": ["범용 목적의 상용 센서 노드로 설계되었다", "단일 DSP 프로세서만 사용한다", "센서 연결에 SPI, 통신 장치 연결에 I²C를 사용한다", "암퇘지의 움직임을 모니터링하는 응용 특화 설계로, 마이크로컨트롤러와 FPGA를 함께 사용한다"], "answer": 3, "explanation": "Hogthrob은 돼지 사육을 위해 암퇘지의 발정과 건강 상태를 감지하는 응용 특화 노드로, MCU와 FPGA 두 개의 프로세서를 사용한다. 인터페이스는 센서용 I²C, 통신 장치용 SPI이다."}, {"q": "소형 센서 노드가 병렬 버스(Parallel bus) 대신 UART, I²C, SPI, CAN과 같은 직렬 인터페이스를 주로 사용하는 이유는?", "options": ["직렬 인터페이스가 항상 병렬 버스보다 데이터 전송률이 높기 때문", "병렬 버스는 동기식 통신을 지원하지 않기 때문", "병렬 버스는 많은 배선과 핀이 필요해 크기, 비용, 전력 소모가 증가하기 때문", "직렬 인터페이스만 마스터-슬레이브 구조를 지원하기 때문"], "answer": 2, "explanation": "병렬 버스는 여러 비트를 동시에 전송해 높은 전송률을 제공하지만 많은 배선과 핀이 필요해 크기, 비용, 전력 소모가 커진다. 그래서 소형 노드는 직렬 인터페이스를 주로 사용한다."}, {"q": "다음 중 SPI가 사용하는 네 개의 핀에 해당하지 않는 것은?", "options": ["MOSI (Master Out, Slave In)", "SCLK (Serial Clock)", "SDA (Serial Data)", "CS (Chip Select)"], "answer": 2, "explanation": "SPI는 MOSI, MISO, SCLK, CS의 네 핀을 사용한다. SDA는 SCL과 함께 I²C가 사용하는 선이다."}, {"q": "8비트 시프트 레지스터를 사용하는 SPI 통신에서 마스터가 슬레이브에 4바이트를 보내는 동안 필요한 클록 펄스 수와, 그 동안 슬레이브로부터 받는 데이터 양은?", "options": ["32개 펄스, 4바이트를 동시에 수신", "32개 펄스, 수신 데이터 없음", "8개 펄스, 4바이트를 동시에 수신", "16개 펄스, 2바이트를 수신"], "answer": 0, "explanation": "SPI는 클록 펄스마다 1비트가 양방향으로 교환되고 8펄스마다 각 방향으로 1바이트가 교환되는 전이중 방식이다. 따라서 4바이트에는 32펄스가 필요하며 동시에 4바이트를 수신한다."}, {"q": "I²C(Inter-Integrated Circuit)의 특징으로 옳은 것은?", "options": ["단일 마스터, 전이중, 비동기식 버스이다", "모토로라가 1980년대에 개발하였다", "MOSI와 MISO 두 선을 사용한다", "다중 마스터, 반이중, 동기식 직렬 버스이며 SCL과 SDA 두 선을 사용한다"], "answer": 3, "explanation": "I²C는 Philips가 개발한 다중 마스터, 반이중, 동기식 직렬 버스로 SCL과 SDA 두 선만 사용한다. 모토로라가 개발한 것은 SPI이다."}, {"q": "I²C의 10비트 주소 체계에서, 시작 조건(S) 이후 10비트 주소 사용을 나타내는 코드는?", "options": ["00000", "11110", "10101", "11111"], "answer": 1, "explanation": "시작 조건 이후 11110 코드가 나오면 10비트 주소 체계를 의미하며, 7비트 주소만 지원하는 장치는 11110으로 시작하는 메시지를 무시한다."}, {"q": "I²C에서 느린 슬레이브를 위한 클록 스트레칭(Clock stretching)의 동작으로 옳은 것은?", "options": ["슬레이브가 SCL 라인을 낮게(0) 유지하여 통신을 멈추게 하고, 준비되면 라인을 놓는다", "마스터가 SDA 라인을 낮게 유지하여 다른 마스터와의 조정에서 이긴다", "슬레이브가 MISO 라인으로 대기 신호를 보낸다", "마스터가 CPOL과 CPHA 값을 바꿔 속도를 낮춘다"], "answer": 0, "explanation": "클록 스트레칭은 슬레이브가 SCL을 0으로 유지해 마스터를 기다리게 하는 핸드셰이킹 방식이다. 두 번째 보기는 다중 마스터 조정(arbitration)에 대한 설명이다."}]}, {"id": "L4", "short": "4강 OS", "title": "Lecture 4 · 운영체제", "questions": [{"q": "WSN 운영체제(OS)의 역할에 대한 설명으로 강의 내용과 거리가 먼 것은?", "options": ["하드웨어와 애플리케이션 사이의 얇은 소프트웨어 계층이다", "개발자를 위한 프로그래밍 추상화(programming abstraction)를 제공한다", "디스크 기반 파일 시스템을 기본으로 제공해 대용량 데이터를 저장한다", "작업을 스케줄링하고 우선순위를 지정한다"], "answer": 2, "explanation": "강의는 센서 노드에 일반적으로 디스크가 없다고 설명하며, 디스크 기반 파일 시스템은 전통적 OS의 특징이자 센서 노드에 문제가 되는 요소로 제시된다."}, {"q": "다음 아두이노 코드에서 LED가 한 번 켜졌다 꺼지는 한 주기(period)는 몇 초인가?\nvoid loop(){ digitalWrite(LED,HIGH); delay(1000); digitalWrite(LED,LOW); delay(1000); }", "options": ["2초", "1초", "0.5초", "4초"], "answer": 0, "explanation": "delay(1000)은 1000 ms(1초)이므로 켜짐 1초 + 꺼짐 1초로 한 주기는 2초이다."}, {"q": "'베어메탈(Bare-metal)' 슈퍼루프(super-loop) 프로그램에 대한 설명으로 옳은 것은?", "options": ["경량 OS가 작업 스케줄링과 메모리 관리를 담당한다", "loop()는 시작 시 한 번만 실행되고 setup()이 계속 반복된다", "OS 없이 프로그램이 하드웨어를 직접 제어하며, setup()은 한 번, loop()는 계속 반복 실행된다", "FreeRTOS 태스크로 동작하므로 여러 작업이 선점형으로 실행된다"], "answer": 2, "explanation": "베어메탈은 스케줄링·파일·프로세스·메모리 관리를 담당하는 OS 없이 프로그램이 하드웨어를 직접 제어하는 방식이며, setup()은 한 번, loop()는 계속 반복된다."}, {"q": "전통적인 OS를 센서 노드에 사용하기 어려운 이유와 그 문제의 연결이 옳지 않은 것은?", "options": ["프로세스마다 별도 메모리 - 센서 노드의 작은 RAM으로는 부족함", "큰 커널과 범용 서비스 - 코드 크기와 전력 소모가 증가함", "전체 OS 설치 방식의 업데이트 - 배치 후 노드 업데이트가 어려움", "하드웨어를 숨기는 범용 API - WSN 응용은 하드웨어 세부사항을 알 필요가 전혀 없으므로 오히려 유리함"], "answer": 3, "explanation": "강의는 WSN 응용이 센서, 무선, 전력을 직접적이고 효율적으로 제어해야 하므로 하드웨어 세부사항을 숨기는 범용 API가 문제라고 설명한다."}, {"q": "단일 작업 OS(Single-Task OS)의 특징으로 옳은 것은?", "options": ["여러 작업을 병렬로 실행하며 많은 메모리가 필요하다", "한 번에 하나의 작업만 실행하고 메모리 사용이 매우 적어 작은 센서 노드에 적합하다", "여러 사용자가 동시에 자원을 공유하는 게이트웨이 노드에 적합하다", "작업이 길수록 지연이 줄어든다"], "answer": 1, "explanation": "단일 작업 OS는 한 번에 하나의 작업만 실행하며, 지연을 피하려면 작업이 짧아야 하고 메모리 사용이 적어 작은 센서 노드에 적합하다."}, {"q": "데이터 수집, 로컬 처리, 무선 통신을 동시에 수행하는 강력한 게이트웨이 노드에 가장 적합한 OS 유형은?", "options": ["단일 작업 OS(Single-Task OS)", "단일 사용자 OS(Single-User OS)", "베어메탈 슈퍼루프", "다중 사용자 OS(Multi-User OS)"], "answer": 3, "explanation": "다중 사용자 OS는 동일 노드에서 여러 애플리케이션·프로세스를 지원하고 자원 공유가 가능해 강력한 게이트웨이 노드에 적합하다고 설명된다."}, {"q": "현대의 보안 OTA(Over-The-Air) 업데이트 절차에서, 동적 재프로그래밍 단계에 추가되어 보안을 제공하는 핵심 요소는?", "options": ["암호 서명(cryptographic signature)과 부트로더의 서명 검증", "업데이트 이미지를 RAM에만 저장하는 방식", "모든 노드를 수동으로 재플래싱하는 방식", "업데이트 실패 시 롤백 기능 제거"], "answer": 0, "explanation": "최신 OTA는 조각 수신·검증·교체의 동적 재프로그래밍 단계를 따르면서 암호 서명을 추가하고, 부트로더가 서명을 확인하며 실패 시 롤백한다."}, {"q": "다음 중 OS의 비기능적 측면(Nonfunctional aspects)에 해당하는 것은?", "options": ["작업 스케줄링(Scheduling)", "이식성(Portability)", "인터럽트 처리(Interrupt handling)", "메모리 할당(Memory allocation)"], "answer": 1, "explanation": "비기능적 측면은 'OS가 얼마나 잘 제공하는지'에 대한 품질 속성으로 관심사 분리, 시스템 오버헤드, 이식성, 동적 재프로그래밍이 해당한다."}, {"q": "WSN OS의 데이터 타입(Data Types)에 대한 설명으로 옳은 것은?", "options": ["복합 데이터 구조는 효율적이지만 표현 능력이 제한된다", "대부분의 WSN OS는 C 기본 타입을 지원하지 않는다", "단순 데이터 타입은 효율적이지만 표현 능력이 제한되며, 대부분의 WSN OS는 C 기본 타입과 struct/enum을 지원한다", "서브시스템 간 통신은 WSN에서 중요하지 않다"], "answer": 2, "explanation": "복합 데이터 구조는 강력하지만 자원을 많이 소모하고, 단순 타입은 효율적이지만 표현력이 제한되며, 대부분 C 기본 타입과 struct/enum을 지원한다."}, {"q": "큐 기반 스케줄링 중 FIFO 방식의 단점과 이를 사용하는 OS의 연결로 옳은 것은?", "options": ["긴 작업이 짧은 작업을 지연시킬 수 있음 - TinyOS", "정렬로 인한 오버헤드 발생 - TinyOS", "긴 작업이 짧은 작업을 지연시킬 수 있음 - LiteOS", "모든 작업이 시간 슬롯을 나눠 동시에 진행됨 - SOS"], "answer": 0, "explanation": "FIFO는 단순하지만 긴 작업이 짧은 작업을 막을 수 있으며 TinyOS가 사용한다. 정렬 오버헤드는 SJF의 특징이다."}, {"q": "'선점형이지만 임계 구역(critical section) 안에서는 절대 중단하지 않는' 스케줄러는?", "options": ["비선점형(Nonpreemptive)", "선점형(Preemptive)", "정중한 선점형(Politely preemptive)", "라운드 로빈(Round-Robin)"], "answer": 2, "explanation": "정중한 선점형(politely preemptive)은 선점형이지만 공유 데이터나 하드웨어를 보호하는 임계 구역 안에서는 중단하지 않는다."}, {"q": "스택(Stack)에 대한 설명으로 옳지 않은 것은?", "options": ["객체는 후입선출(LIFO) 방식으로 접근된다", "서브루틴 완료 후 복귀할 주소를 기억하는 데 사용된다", "멀티스레딩 OS에서는 각 스레드가 자체 스택을 가져 더 많은 자원을 소모한다", "프로세서는 스택의 맨 아래 주소를 꺼내 복귀한다"], "answer": 3, "explanation": "프로세서는 스택의 맨 위(top)에서 주소를 꺼내(pop) 복귀한다."}, {"q": "인터럽트 마스크(interrupt mask)에 대한 설명으로 가장 옳은 것은?", "options": ["모든 인터럽트를 항상 최우선으로 처리하게 만든다", "특정 저수준 인터럽트를 차단할 수 있지만 데이터 손상이나 이벤트 누락을 일으킬 수 있다", "마스크를 설정하면 위험 없이 관련 없는 인터럽트를 무시할 수 있다", "마스크 불가능한 인터럽트(nonmaskable interrupt)는 어떤 OS에도 존재하지 않는다"], "answer": 1, "explanation": "마스킹은 관련 없는 인터럽트를 무시하게 하지만 위험할 수 있어 데이터 손상이나 이벤트 누락을 유발할 수 있으며, 일부 OS는 중요한 작업을 위해 마스크 불가능한 인터럽트를 제공한다."}, {"q": "Maté에 대한 설명으로 옳은 것은?", "options": ["TinyOS 위에서 동작하는 작은 스택 기반 가상 머신으로, 노드를 다시 플래싱하지 않고 캡슐(capsule) 단위로 작은 프로그램을 주입할 수 있다", "전체 네트워크가 하나의 자바 가상 머신처럼 동작하는 코넬 대학의 분산 OS이다", "유한 상태 기계(FSM) 모델 기반의 경량 OS이다", "500바이트 미만 RAM의 선점형 멀티스레드 OS이다"], "answer": 0, "explanation": "Maté는 TinyOS 위의 스택 기반 VM으로, 가장 작은 코드 배포 단위인 캡슐이 홉 단위로 전파된다. 나머지는 각각 MagnetOS, SenOS, MANTIS의 설명이다."}, {"q": "센서 OS에서 이벤트 기반(Event-based) 프로그래밍의 특징으로 옳은 것은?", "options": ["각 스레드가 스택을 가지므로 메모리가 많이 필요하다", "락(lock)과 데이터 공유 때문에 코드 작성이 어렵다", "하나의 메인 루프를 사용해 메모리를 적게 쓰고 단순하지만, 긴 작업이나 블로킹 작업에는 적합하지 않다", "LiteOS와 MANTIS가 대표적인 이벤트 기반 OS이다"], "answer": 2, "explanation": "이벤트 기반은 하나의 메인 루프와 작은 핸들러로 메모리를 적게 쓰지만 긴·블로킹 작업에 부적합하며, TinyOS와 SOS가 예이다."}, {"q": "OS와 프로그래밍 모델의 연결이 옳지 않은 것은?", "options": ["TinyOS - 이벤트 기반", "Contiki - 하이브리드", "LiteOS - 스레드 기반", "SOS - 스레드 기반"], "answer": 3, "explanation": "SOS는 TinyOS와 함께 이벤트 기반 OS이며, 스레드 기반은 LiteOS와 MANTIS이다."}, {"q": "동적 메모리 할당(Dynamic Memory Allocation)에 대한 설명으로 옳은 것은?", "options": ["컴파일/시작 시 메모리 크기가 결정되어 실행 중 변경할 수 없다", "실행 중 메모리를 요청·해제할 수 있어 유연하지만 관리 오버헤드와 단편화(fragmentation) 위험이 있다", "TinyOS가 대표적으로 사용하는 방식이다", "오버헤드가 전혀 없어 가장 예측 가능한 방식이다"], "answer": 1, "explanation": "동적 할당은 실행 중 요청·해제가 가능해 유연하지만 관리 오버헤드와 단편화 위험이 있으며 SOS, Contiki, LiteOS가 사용한다. TinyOS는 정적 할당이다."}, {"q": "센서 노드의 메모리 종류와 주된 용도의 연결로 옳은 것은?", "options": ["RAM - 크고 블록 단위로 지워지며 코드와 새 이미지 저장", "EEPROM - 빠르고 휘발성이며 상태와 스택 저장", "Flash - 크고 블록 단위로 지워지며 코드, 로그, 새 이미지 저장", "Flash - 작고 바이트 단위 쓰기가 가능하며 설정 저장"], "answer": 2, "explanation": "RAM은 빠르고 휘발성(상태·스택), EEPROM은 작고 바이트 쓰기 가능(설정·파일 테이블), Flash는 크고 블록 단위로 지워짐(코드·로그·새 이미지)이다."}, {"q": "강의에 제시된 최소 오버헤드 값에 따르면, SOS의 최소 오버헤드는 TinyOS보다 약 몇 바이트 더 큰가?", "options": ["약 478 B", "약 353 B", "약 1495 B", "약 831 B"], "answer": 3, "explanation": "SOS 최소 약 1163 B - TinyOS 332 B = 약 831 B이다."}, {"q": "동적 재프로그래밍(Dynamic Reprogramming)에 대한 설명으로 옳지 않은 것은?", "options": ["배치 후 환경이나 요구사항이 변하거나 버그를 수정하기 위해 필요하다", "애플리케이션과 OS가 명확히 분리되지 않아도 항상 가능하다", "OS는 업데이트를 조각 단위로 받아 임시 저장하고, 올바른 버전인지 확인한 뒤 교체할 수 있어야 한다", "이 과정은 자원을 소비하며 새로운 버그를 만들 수도 있다"], "answer": 1, "explanation": "강의는 애플리케이션과 OS가 명확히 분리되지 않으면 동적 재프로그래밍이 불가능하다고 설명한다."}, {"q": "OS 전력 관리(OSPM/DPM)에 대한 설명으로 옳은 것은?", "options": ["유휴 상태가 되면 비용과 관계없이 항상 즉시 깊은 수면으로 전환한다", "깊은 수면(deep sleep)일수록 전력 소모가 적고 깨어나는 시간도 짧다", "수면 전환에는 비용이 없고 깨어나는 데도 시간이 들지 않는다", "이벤트 도착 모델과 전환 비용을 고려해 기대 에너지 절감이 양수일 때만 전환한다"], "answer": 3, "explanation": "OSPM은 전환 비용과 이벤트 도착을 고려해 절감 에너지가 양수일 때만 전환하며, 깊은 수면일수록 전력은 적지만 깨어나는 데 오래 걸린다."}, {"q": "TinyOS의 태스크(Task)에 대한 설명으로 옳은 것은?", "options": ["태스크는 끝까지 실행되며 인터럽트만 잠시 중단시킬 수 있고, 태스크끼리 서로 선점하지 않으므로 하나의 스택만 필요하다", "우선순위가 높은 태스크가 낮은 태스크를 선점한다", "각 태스크는 자체 스택을 가진다", "태스크는 다른 태스크를 예약(post)할 수 없다"], "answer": 0, "explanation": "TinyOS 태스크는 run-to-completion이며 인터럽트만 잠시 선점 가능하고, 태스크 간 선점이 없어 하나의 스택만 사용한다. 태스크는 다른 태스크를 post할 수 있다."}, {"q": "TinyOS의 분할 단계(Split-phase) 동작으로 패킷을 전송할 때의 흐름으로 옳은 것은?", "options": ["Send.sendDone() 이벤트로 전송을 시작하고 call Send.send(msg)로 완료를 알린다", "call Send.send(msg) 명령이 즉시 반환되고, 전송 중 CPU는 다른 일이나 수면이 가능하며, 나중에 Send.sendDone() 이벤트로 완료를 알린다", "call Send.send(msg) 후 전송이 끝날 때까지 CPU가 바쁜 대기(busy-wait)한다", "명령은 하위에서 상위로, 이벤트는 상위에서 하위로 전달된다"], "answer": 1, "explanation": "분할 단계는 긴 작업을 명령(시작, 즉시 반환)과 이벤트(나중에 완료 알림)로 나누며, 명령은 위→아래, 이벤트는 아래→위로 전달된다."}, {"q": "nesC 언어와 컴파일 모델에 대한 설명으로 옳지 않은 것은?", "options": ["nesC 컴파일러가 모든 .nc 구성 요소를 하나의 C 파일(app.c)로 변환한다", "gcc 같은 기본 C 컴파일러가 app.c를 모트 바이너리로 컴파일한다", "malloc과 힙, 함수 포인터를 지원하는 동적 언어이다", "FIFO 작업 스케줄러를 포함하며 코드 재사용과 모듈화를 촉진한다"], "answer": 2, "explanation": "nesC는 정적 언어로 malloc, 힙, 함수 포인터가 없다."}, {"q": "SOS, Contiki, LiteOS에 대한 설명으로 옳은 것은?", "options": ["SOS는 실행 중 모듈을 적재·해제할 수 있으며, 모듈은 위치 독립 바이너리라 커널이 동적으로 연결할 수 있다", "Contiki의 프로토스레드는 스레드마다 큰 자체 스택을 가진다", "LiteOS는 노드가 세션 상태(현재 폴더, 명령 이력)를 저장해 PC 셸의 부담을 줄인다", "LiteOS 커널은 노드당 최대 32개의 스레드를 실행한다"], "answer": 0, "explanation": "SOS 모듈은 위치 독립 바이너리로 실행 중 적재·해제된다. 프로토스레드는 자체 스택이 없고, LiteOS 노드는 stateless이며 최대 8개 스레드를 실행한다."}]}, {"id": "L5", "short": "5강 PHY", "title": "Lecture 5 · 물리 계층", "questions": [{"q": "강의에서 제시한 물리 계층(PHY)의 주요 기능에 해당하지 않는 것은?", "options": ["라우팅 경로 결정 (routing)", "변조 (modulation)", "주파수 채널 선택 (frequency channel selection)", "송신 전력 (transmit power) 조절"], "answer": 0, "explanation": "물리 계층의 주요 기능은 부호화, 변조, 주파수 채널 선택, 송신 전력입니다. 라우팅은 상위 계층(네트워크 계층)의 역할입니다."}, {"q": "대역폭 B = 50 Hz인 온도 신호를 정보 손실 없이 샘플링하려면 나이퀴스트 규칙(Nyquist rule)에 따라 초당 최소 몇 개의 샘플이 필요한가?", "options": ["25개", "50개", "100개", "200개"], "answer": 2, "explanation": "나이퀴스트 규칙은 fs ≥ 2B이므로 2 × 50 Hz = 초당 최소 100개 샘플이 필요합니다. 이보다 느리게 샘플링하면 에일리어싱(aliasing)이 발생합니다."}, {"q": "양자화(quantization)에 대한 설명으로 옳은 것은?", "options": ["n비트를 사용하면 n²개의 레벨을 표현할 수 있다", "비트 수가 많을수록 양자화 오차는 줄지만 전송할 데이터는 늘어난다", "양자화 오차는 시간에 따라 변하지 않는 상수이다", "양자화 오차는 양자화 값에서 실제 값을 더한 값이다"], "answer": 1, "explanation": "n비트는 2ⁿ개 레벨을 주며, 비트가 많을수록 오차는 작아지지만 전송량이 늘어납니다. 양자화 오차(= 실제 값 − 양자화 값)는 확률 변수처럼 시간에 따라 변합니다."}, {"q": "이진 코드북이 고유하게 디코딩(uniquely decodable)되기 위해 만족해야 하는 Kraft–McMillan 부등식의 조건은? (u: 코드워드 수, lᵢ: i번째 코드워드 길이, r: 심볼 수)", "options": ["Σ r^(lᵢ) ≥ 1", "Σ lᵢ / r ≤ 1", "Σ (1/r)^(u) = 1", "Σ (1/r)^(lᵢ) ≤ 1"], "answer": 3, "explanation": "Kraft–McMillan 부등식은 Σ(i=1~u) 1/r^(lᵢ) ≤ 1 입니다. 이 조건은 코드워드 시퀀스가 겹치지 않도록 보장합니다."}, {"q": "즉시 디코딩 가능한 코드(instantaneous / prefix-free code)의 조건으로 옳은 것은?", "options": ["모든 코드워드의 길이가 반드시 서로 달라야 한다", "어떤 코드워드도 다른 코드워드의 접두사(prefix)가 아니어야 한다", "Kraft 합이 반드시 1보다 커야 한다", "코드워드의 끝을 알기 위해 다음 비트를 미리 보아야(look ahead) 한다"], "answer": 1, "explanation": "어떤 코드워드도 다른 코드워드의 접두사가 아니면 코드워드가 끝나는 즉시 미리 보지 않고 디코딩할 수 있습니다. 강의 예시에서 Kraft 합이 1이어도 프리픽스 조건을 위반하면 즉시 디코딩이 불가능했습니다."}, {"q": "AWGN(Additive White Gaussian Noise) 잡음 모델에서 '백색(White)'과 '가우시안(Gaussian)'의 의미로 옳은 것은?", "options": ["백색: 잡음 전력이 모든 주파수에 거의 고르게 분포 / 가우시안: 순간 진폭이 종 모양(정규) 분포를 따름", "백색: 잡음이 특정 주파수에만 집중됨 / 가우시안: 진폭이 항상 일정함", "백색: 잡음이 신호에 곱해짐 / 가우시안: 큰 튐(spike)이 자주 발생함", "백색: 엔지니어가 실제 시스템에 일부러 더한 잡음 / 가우시안: 잡음을 완전히 제거할 수 있음"], "answer": 0, "explanation": "백색은 잡음 전력이 모든 주파수에 고르게 퍼져 있음을, 가우시안은 진폭이 정규 분포를 따라 작은 값은 자주, 큰 튐은 드묾을 뜻합니다. AWGN은 신호에 더해지는(r(t) = s(t) + n(t)) 잡음이며 완전히 없앨 수 없습니다."}, {"q": "PCM(Pulse Code Modulation)과 DM(Delta Modulation)에 대한 설명으로 옳은 것은?", "options": ["PCM과 DM은 반송파에 데이터를 싣는 무선 변조 방식이다", "DM은 샘플당 많은 비트(예: 8비트)를 사용한다", "PCM은 빠른 변화를 잘 따라가지 못하고 지연(lag)이 생긴다", "DM은 변화만 전송하며 샘플당 1비트만 사용한다"], "answer": 3, "explanation": "DM은 상승이면 1, 하강이면 0만 보내 샘플당 1비트를 사용하며 느리고 부드러운 신호에 적합합니다. PCM과 DM은 이름과 달리 무선 변조가 아니라 소스 부호화 방법입니다."}, {"q": "PCM으로 초당 100개 샘플을 취하고 샘플당 8비트로 부호화할 때 데이터율(data rate)은?", "options": ["108 bits/s", "12.5 bits/s", "800 bits/s", "8,000 bits/s"], "answer": 2, "explanation": "데이터율 = 초당 샘플 수 × 샘플당 비트 = 100 × 8 = 800 bits/s입니다."}, {"q": "델타 변조(DM)에서 수신기의 현재 추정값이 20.0°C이고 새 샘플이 20.3°C일 때(단계 크기 0.5°C), 전송 비트와 새 추정값은?", "options": ["비트 1, 새 추정값 20.5°C", "비트 0, 새 추정값 19.5°C", "비트 1, 새 추정값 20.3°C", "비트 0, 새 추정값 20.5°C"], "answer": 0, "explanation": "새 샘플이 현재 추정값보다 크면 1을 보내고 추정값을 +0.5°C 올립니다. 따라서 비트 1, 새 추정값 20.5°C입니다."}, {"q": "다중 경로(multipath)와 페이딩(fading)에 대한 설명으로 옳지 않은 것은?", "options": ["같은 신호가 직접 경로와 반사 경로로 여러 번 도착하는 것이 다중 경로이다", "송신 전력을 높이면 다중 경로 현상이 완전히 사라진다", "늦게 도착한 반사파가 다음 비트와 섞일 수 있다", "약 3 cm 떨어진 두 안테나 중 더 좋은 쪽을 사용하는 것이 해결책이 될 수 있다"], "answer": 1, "explanation": "강의의 해결책은 안테나 이동, 두 안테나 사용, 확산 스펙트럼·오류 정정·재전송, 모터·금속에서 떨어뜨리기입니다. 송신 전력 증가로 다중 경로가 완전히 사라진다는 내용은 없습니다."}, {"q": "섀넌–하틀리 정리(Shannon–Hartley theorem) C = B·log₂(1 + S/N)에 대한 설명으로 옳은 것은?", "options": ["데이터 속도가 C보다 높을 때만 오류 없는 전송이 가능하다", "B는 초당 비트 단위의 채널 용량이다", "SNR이 낮아질수록 채널 용량은 증가한다", "SNR이 높거나 대역폭이 넓을수록 용량이 증가한다"], "answer": 3, "explanation": "C는 bps 단위 채널 용량, B는 Hz 단위 대역폭이며, SNR이 높거나 대역폭이 넓을수록 용량이 증가합니다. 오류 없는 전송은 데이터 속도가 C보다 낮을 때만 가능합니다."}, {"q": "채널 폭 B = 2 MHz, 측정된 SNR = 20 dB인 ZigBee 채널의 섀넌 용량은 약 얼마인가? (log₂(101) ≈ 6.66)", "options": ["약 2 Mbps", "약 0.25 Mbps", "약 13.3 Mbps", "약 40 Mbps"], "answer": 2, "explanation": "20 dB는 S/N = 100이므로 C = 2,000,000 × log₂(1+100) ≈ 2,000,000 × 6.66 ≈ 13.3 Mbps입니다. 실제 ZigBee는 0.25 Mbps만 사용해 여유가 큽니다."}, {"q": "데시벨(dB) 표현에 대한 설명으로 옳은 것은?", "options": ["전력 비 1000은 30 dB이고, 100 mW는 20 dBm이다", "전력 비 1000은 3 dB이고, 100 mW는 100 dBm이다", "전력 비 2배는 약 +10 dB이다", "SNR이 0 dB이면 신호가 잡음보다 10배 강하다"], "answer": 0, "explanation": "dB = 10·log₁₀(비율)이므로 1000은 30 dB이고, dBm은 1 mW 기준이므로 100 mW = 20 dBm입니다. 2배는 약 +3 dB, 0 dB는 신호와 잡음이 같음을 뜻합니다."}, {"q": "전송 속도가 채널 용량을 초과하여 보낸 정보가 채널에서 사라지는 감산성 오류(subtractive error)를 무엇이라 하는가?", "options": ["무관 정보 (irrelevance)", "모호도 (equivocation)", "상호 정보량 (transinformation)", "양자화 오차 (quantization error)"], "answer": 1, "explanation": "보냈지만 채널에서 사라진 정보를 모호도(equivocation)라 합니다. 잡음이 더한 의미 없는 정보는 무관 정보(irrelevance), 실제 도달한 유용한 정보는 상호 정보량입니다."}, {"q": "이진 소거 채널(BEC, Binary Erasure Channel)의 특징으로 옳은 것은?", "options": ["비트가 0에서 1로, 1에서 0으로 틀리게 도착할 수 있다", "모든 비트가 항상 오류 없이 도착한다", "비트가 사라질(?) 수는 있지만 틀리게 도착하지는 않는다", "이전 비트의 결과에 따라 다음 비트의 오류 확률이 달라진다"], "answer": 2, "explanation": "BEC에서는 비트가 손실(?)될 수 있으나 틀리지는 않으며, 수신기는 빠진 비트만 다시 요청하면 됩니다. 비트가 틀리게 도착하는 것은 이진 대칭 채널(BSC)의 특징입니다."}, {"q": "WSN용 상용 무선 기술 비교에서 IEEE 802.15.4 (ZigBee)에 대한 설명으로 옳은 것은?", "options": ["전송 속도 2~54 Mbps, 배터리 수명 수 분~수 시간", "전송 속도 1~3 Mbps, 상대 비용 1× (기준)", "전송 범위 100 m, 전력 소비 중간(Medium)", "전송 속도 0.25 Mbps, 전력 소비 초저전력(Ultra low), 배터리 수명 수일~수년"], "answer": 3, "explanation": "ZigBee는 0.25 Mbps로 느리지만 초저전력·저비용(0.2×)이며 배터리로 수년간 동작해 센서에 적합합니다. 2~54 Mbps는 Wi-Fi, 1~3 Mbps와 비용 1×는 Bluetooth입니다."}, {"q": "각 비트를 3번 반복 전송하는 FEC(전방 오류 정정)에서 수신기에 101이 도착했다면 복원되는 비트와 FEC의 특징으로 옳은 것은?", "options": ["1 — 재전송 대기 없이 수신기가 직접 오류를 수정한다", "0 — 수신기가 송신기에 재전송을 요청한다", "1 — 전송 비트와 처리량이 줄어든다", "판단 불가 — 반드시 ARQ로 재전송해야 한다"], "answer": 0, "explanation": "다수결로 101은 1로 복원되며, FEC는 대기 없이 수신기가 직접 수정합니다. 대신 전송 비트와 처리량이 늘어납니다."}, {"q": "안테나는 파장의 약 1/4 길이일 때 잘 동작한다. 2.4 GHz 반송파(파장 약 12.5 cm)를 사용할 때 적절한 안테나 길이는 약 얼마인가?", "options": ["약 75 km", "약 12.5 cm", "약 50 cm", "약 3 cm"], "answer": 3, "explanation": "12.5 cm의 1/4은 약 3 cm로, 휴대폰이나 센서 안에 들어갈 수 있습니다. 반면 1 kHz 신호를 직접 보내면 파장 300 km, 안테나 75 km가 필요해 불가능합니다."}, {"q": "디지털 변조 방식과 강의에서 제시한 사용 예의 연결이 옳은 것은?", "options": ["ASK — Wi-Fi", "PSK — ZigBee, Wi-Fi", "FSK — RFID 태그", "PSK — 자동차 키 리모컨"], "answer": 1, "explanation": "PSK는 ZigBee와 Wi-Fi에, ASK는 RFID 태그와 자동차 키 리모컨에, FSK(부드러운 형태)는 블루투스에 사용됩니다."}, {"q": "강의의 QPSK 매핑표(00→45°, 01→135°, 11→225°, 10→315°)에 따라 비트열 0 0 1 1 1 0 0 1을 전송할 때 송신되는 위상 순서는?", "options": ["45°, 135°, 225°, 315°", "45°, 315°, 225°, 135°", "45°, 225°, 315°, 135°", "135°, 225°, 315°, 45°"], "answer": 2, "explanation": "비트를 2개씩 묶으면 00 | 11 | 10 | 01이므로 45°, 225°, 315°, 135°가 됩니다. 8비트를 4개 심볼로 전송합니다."}, {"q": "성상도(constellation)의 점이 64개인 64QAM에서 심볼당 전송되는 비트 수는?", "options": ["6비트", "4비트", "8비트", "64비트"], "answer": 0, "explanation": "점의 개수가 2배가 될 때마다 심볼당 1비트가 늘어나므로 64 = 2⁶, 즉 심볼당 6비트입니다."}, {"q": "10비트 ADC로 가속도 센서를 1 kHz로 샘플링하여 얻은 10 kbps 데이터를 8PSK(심볼당 3비트)로 전송할 때 심볼율(symbol rate)은 약 얼마인가?", "options": ["10 kbaud", "30 kbaud", "3.33 kbaud", "5 kbaud"], "answer": 2, "explanation": "심볼율 = 비트율 ÷ 심볼당 비트 = 10 kbps ÷ 3 ≈ 3.33 kbaud입니다. 심볼율이 낮아 스펙트럼은 BPSK의 1/3만 필요하지만 수신기는 더 많은 위상을 구별해야 합니다."}, {"q": "ISM 대역(Industrial, Scientific and Medical band)에 대한 설명으로 옳지 않은 것은?", "options": ["902~928 MHz 대역(중심 915 MHz)은 아메리카 지역에서 사용된다", "2.400~2.500 GHz 대역은 전 세계에서 사용된다", "누구나 무료로 사용할 수 있지만 출력 제한은 지켜야 한다", "면허 기반으로 할당되므로 장치 간 간섭이 발생하지 않는다"], "answer": 3, "explanation": "ISM 대역은 면허 없이 누구나 무료로 쓰지만 같은 대역을 공유하므로 장치끼리 간섭합니다. 예를 들어 전자레인지가 돌면 2.4 GHz Wi-Fi가 느려질 수 있습니다."}, {"q": "열린 공간(open space)에서 송수신 거리를 2배로 늘리면 수신 전력은 어떻게 변하는가?", "options": ["1/2로 약해진다 (−3 dB)", "1/4로 약해진다 (−6 dB)", "1/16로 약해진다 (−12 dB)", "변하지 않는다 (0 dB)"], "answer": 1, "explanation": "열린 공간에서는 전력이 거리 × 거리에 비례해 감소하므로 2배 멀어지면 4배 약해집니다(−6 dB). 벽과 나무가 있으면 최대 16배(−12 dB)까지 약해집니다."}, {"q": "옆방의 센서 신호가 석고보드 벽 2개(각 3 dB)와 콘크리트 바닥 1개(13 dB)를 통과할 때 추가 손실과 대략적인 신호 약화 정도는?", "options": ["19 dB, 약 80배 약해짐", "16 dB, 약 16배 약해짐", "39 dB, 약 8000배 약해짐", "19 dB, 약 19배 약해짐"], "answer": 0, "explanation": "벽과 바닥마다 손실이 더해지므로 3 + 3 + 13 = 19 dB이며, 이는 약 80배 약해지는 것에 해당합니다."}]}, {"id": "L6", "short": "6강 MAC", "title": "Lecture 6 · MAC 계층", "questions": [{"q": "MAC(Medium Access Control) 계층은 OSI 모델에서 어디에 위치하는가?", "options": ["데이터 링크 계층(2계층)의 하위 계층으로, 물리 계층 바로 위", "네트워크 계층(3계층)의 하위 계층으로, 데이터 링크 계층 바로 위", "물리 계층(1계층)의 일부로, 전송 매체 바로 위", "전송 계층(4계층)의 일부로, 네트워크 계층 바로 위"], "answer": 0, "explanation": "MAC은 OSI 모델 2계층(데이터 링크 계층)의 하위 계층이며 물리 계층 바로 위에서 동작한다."}, {"q": "IEEE 802 참조 모델에 따르면 데이터 링크 계층은 어떤 두 부분으로 나뉘는가?", "options": ["PHY와 MAC", "LLC(Logical Link Control)와 MAC(Medium Access Control)", "LLC와 RLC(Radio Link Control)", "MAC과 NWK(Network)"], "answer": 1, "explanation": "IEEE 802 참조 모델은 데이터 링크 계층을 논리적 통신 제어를 담당하는 LLC와 매체 접근 제어를 담당하는 MAC으로 나눈다."}, {"q": "강의에서 무선 센서 네트워크(WSN)의 에너지 소모 원인으로 제시되지 않은 것은?", "options": ["유휴 청취(idle listening)", "충돌 후 재전송(retransmissions after collisions)", "높은 CPU 클럭에 따른 연산 부하", "필요 이상의 송신 전력(transmit power higher than needed)"], "answer": 2, "explanation": "강의는 데이터 송수신 외 에너지 소모 원인으로 유휴 청취, 충돌 후 재전송, 제어 패킷과 오버헤드, 필요 이상의 송신 전력을 제시했다. 연산 부하는 언급되지 않았다."}, {"q": "WSN MAC 프로토콜의 설계 트레이드오프(trade-off)에 대한 설명으로 강의 내용과 일치하는 것은?", "options": ["처리량을 높이기 위해 에너지 효율을 희생한다.", "공정성을 높이기 위해 지연을 줄인다.", "에너지를 아끼기 위해 지연, 처리량, 공정성을 일부 희생한다.", "신뢰성을 높이기 위해 송신 전력을 항상 최대로 유지한다."], "answer": 2, "explanation": "WSN MAC 프로토콜은 에너지 절약을 위해 더 높은 지연이나 더 낮은 처리량·공정성을 감수하는 경우가 많다."}, {"q": "MAC 프레임 예시에서 FCS(Frame Check Sequence) 필드의 역할은?", "options": ["송신자와 수신자 식별", "프레임 순서 번호 표시", "상위 계층 데이터 운반", "CRC를 이용한 오류 검출"], "answer": 3, "explanation": "MAC 프레임의 FCS는 CRC를 담아 오류 검출에 사용된다. 주소 필드는 송수신자 식별, Payload는 상위 계층 데이터를 담는다."}, {"q": "MAC 계층의 흐름 제어(Flow Control) 기능에 대한 설명으로 옳은 것은?", "options": ["데이터를 출발지·목적지 주소가 포함된 프레임으로 구성한다.", "송수신자 간의 전송 속도를 조절하여 버퍼 오버플로를 방지한다.", "여러 장치가 동시에 전송하지 않도록 전송 시점을 결정한다.", "CSMA/CA를 이용해 충돌을 회피한다."], "answer": 1, "explanation": "흐름 제어는 송수신자 간 전송 속도를 조절해 버퍼 오버플로를 방지하고 원활한 통신을 유지하는 기능이다."}, {"q": "다음 중 경쟁형(contention-based) MAC 프로토콜의 예로만 묶인 것은?", "options": ["FDMA, TDMA, CDMA", "ALOHA, CSMA, MACA, MACAW", "폴링, 토큰 전달, 예약 기반", "TDMA, CSMA, 토큰 전달"], "answer": 1, "explanation": "경쟁형 프로토콜의 예는 ALOHA, CSMA, MACA, MACAW이다. FDMA·TDMA·CDMA는 고정 할당, 폴링·토큰 전달·예약은 동적 할당 비경쟁형이다."}, {"q": "비경쟁형(contention-free) MAC 프로토콜 중 동적 할당(dynamic assignment)에 해당하는 것은?", "options": ["FDMA", "TDMA", "CDMA", "토큰 전달(Token Passing)"], "answer": 3, "explanation": "동적 할당 방식은 폴링, 토큰 전달, 예약 기반이며, FDMA·TDMA·CDMA는 자원을 미리 예약하는 고정 할당 방식이다."}, {"q": "하이브리드(hybrid) MAC 프로토콜의 특징으로 옳은 것은?", "options": ["비경쟁형과 경쟁형의 특성을 결합하여 장점을 극대화하고 단점을 최소화한다.", "주파수와 시간을 동시에 나누는 고정 할당 방식이다.", "중앙 제어기 없이 토큰만으로 접근을 제어한다.", "ALOHA와 Slotted ALOHA를 번갈아 사용한다."], "answer": 0, "explanation": "하이브리드 프로토콜은 비경쟁형과 경쟁형의 특성을 결합해 장점은 극대화하고 단점은 최소화하는 것을 목표로 한다."}, {"q": "FDMA(Frequency Division Multiple Access)에 대한 설명으로 옳은 것은?", "options": ["모든 노드가 같은 주파수를 쓰되 서로 다른 시간 슬롯을 사용한다.", "모든 노드가 같은 주파수, 같은 시간에 서로 다른 코드로 전송한다.", "주파수 대역을 작은 대역으로 나누어 각 노드가 고유한 대역을 사용한다.", "노드가 전송 전에 채널을 감지하고 비어 있으면 전송한다."], "answer": 2, "explanation": "FDMA는 주파수 대역을 여러 작은 대역으로 나누어 각 노드가 고유한 대역을 사용하므로 통신 쌍 간 간섭을 방지한다."}, {"q": "FDMA, TDMA, CDMA 비교에서 각 방식의 단점이 올바르게 짝지어진 것은?", "options": ["FDMA: 시간 동기화 필요 / TDMA: 보호 대역 낭비 / CDMA: 빈 슬롯 낭비", "FDMA: 복잡한 수신기 / TDMA: 보호 대역 낭비 / CDMA: 동기화 필요", "FDMA: 빈 슬롯 낭비 / TDMA: 복잡한 수신기 / CDMA: 보호 대역 낭비", "FDMA: 보호 대역으로 스펙트럼 낭비 / TDMA: 동기화 필요, 빈 슬롯 낭비 / CDMA: 복잡한 수신기, 코드 필요"], "answer": 3, "explanation": "FDMA는 보호 대역(guard band)으로 스펙트럼을 낭비하고, TDMA는 동기화가 필요하며 빈 슬롯이 낭비되고, CDMA는 수신기가 복잡하고 직교 코드가 필요하다."}, {"q": "강의의 비유와 실제 예에서 TDMA에 해당하는 것으로 옳은 것은?", "options": ["라디오 방송국 / FM 라디오, 1세대 이동통신", "한 방에서 다른 언어로 대화 / 3세대 이동통신", "수업 시간표 / 2세대 GSM", "발언 막대 / 유선 이더넷"], "answer": 2, "explanation": "TDMA는 같은 교실을 다른 시간에 쓰는 수업 시간표에 비유되며, 실제 예는 2G GSM이다."}, {"q": "CDMA(Code Division Multiple Access)에서 여러 노드가 간섭 없이 동시 전송할 수 있게 하는 요소는?", "options": ["보호 대역(guard band)", "직교 코드(orthogonal codes)", "고정 크기 시간 슬롯", "RTS/CTS 핸드셰이크"], "answer": 1, "explanation": "CDMA는 같은 주파수를 쓰지만 서로 다른 코드를 사용하며, 직교 코드를 쓰면 간섭 없이 동시 전송이 가능하다. FEC는 간섭 복구에 도움을 준다."}, {"q": "TDMA 프레임에 노드 N1~N4의 슬롯이 하나씩 있고, N2와 N4는 보낼 데이터가 없어 슬롯이 비어 있다. 고정 할당의 한계를 고려할 때 옳은 설명은?", "options": ["4개 슬롯 중 2개가 낭비되며, 데이터가 더 있는 N3도 다음 차례까지 기다려야 한다.", "N2와 N4의 빈 슬롯은 자동으로 N3에게 재할당된다.", "빈 슬롯이 있으면 충돌이 발생하여 N1과 N3의 데이터도 손실된다.", "빈 슬롯은 다음 프레임으로 이월되어 N2와 N4가 두 배로 사용한다."], "answer": 0, "explanation": "고정 할당에서는 데이터가 없는 노드의 슬롯이 비어도 다른 노드에게 줄 수 없어 낭비되며(여기서는 4개 중 2개, 50%), 패킷이 더 있는 노드도 다음 차례를 기다려야 한다."}, {"q": "동적 할당 방식 중 폴링(Polling)에 대한 설명으로 옳은 것은?", "options": ["제어기(예: 기지국)가 각 노드에 차례로 보낼 데이터가 있는지 묻는다.", "토큰이라는 특수 프레임을 가진 노드만 전송할 수 있다.", "노드가 예약 비트를 설정해 향후 슬롯을 예약한다.", "노드가 전송 전에 채널을 감지한 후 확률 p로 전송한다."], "answer": 0, "explanation": "폴링은 제어기가 각 노드에 차례로 데이터가 있는지 묻고, 없으면 다음 노드를 폴링하는 방식으로 선생님이 학생에게 차례로 묻는 것에 비유된다."}, {"q": "경쟁 기반(contention-based) MAC 프로토콜의 장단점으로 옳은 것은?", "options": ["장점: 충돌이 전혀 없음 / 단점: 스케줄이 필요함", "장점: 트래픽이 많을수록 성능 향상 / 단점: 중앙 제어 필요", "장점: 고정 슬롯으로 신뢰성 높음 / 단점: 토폴로지 변화 시 재할당 필요", "장점: 스케줄이나 중앙 제어가 불필요하고 변화에 쉽게 적응 / 단점: 충돌로 에너지·대역폭 낭비, 트래픽 많으면 성능 저하"], "answer": 3, "explanation": "경쟁 기반 방식은 스케줄이나 중앙 제어가 필요 없고 트래픽·토폴로지 변화에 쉽게 적응하지만, 충돌로 에너지와 대역폭이 낭비되고 트래픽이 많으면 성능이 떨어진다."}, {"q": "순수 ALOHA와 Slotted ALOHA의 최대 처리량(max throughput)으로 강의에서 제시된 값은?", "options": ["순수 약 37%, 슬롯형 약 18%", "순수 약 50%, 슬롯형 약 100%", "순수 약 18%, 슬롯형 약 37%", "순수 약 10%, 슬롯형 약 20%"], "answer": 2, "explanation": "ALOHA의 최대 처리량은 순수 ALOHA가 약 18%, Slotted ALOHA가 약 37%로, 슬롯화를 통해 효율이 약 두 배가 된다."}, {"q": "CSMA의 세 가지 유형 중 채널이 사용 중(busy)일 때 계속 감지하다가 비워지는 즉시 100% 확률로 전송하는 방식은?", "options": ["Non-persistent CSMA", "p-persistent CSMA", "1-persistent CSMA", "Slotted ALOHA"], "answer": 2, "explanation": "1-persistent CSMA는 매우 공격적인 방식으로, 채널이 비면 즉시 전송하므로 대기 노드가 많으면 충돌 가능성이 높다."}, {"q": "p-persistent CSMA에서 p = 0.3일 때, 채널이 유휴(idle) 상태인 슬롯에서 노드의 동작으로 옳은 것은?", "options": ["확률 0.3으로 전송하고, 확률 0.7로 다음 슬롯까지 기다린다.", "확률 0.7로 전송하고, 확률 0.3으로 다음 슬롯까지 기다린다.", "항상 즉시 전송한다.", "임의의 시간 동안 기다린 후 다시 감지한다."], "answer": 0, "explanation": "p-persistent CSMA는 채널이 비면 확률 p로 전송하고 확률 1 − p로 다음 슬롯까지 기다리므로, p = 0.3이면 0.3 확률로 전송하고 0.7 확률로 대기한다."}, {"q": "슬롯형 CSMA(Slotted CSMA)에서 슬롯 크기가 20 µs일 때, 가능한 백오프(backoff) 대기 시간은?", "options": ["25 µs", "33.5 µs", "1.73 ms", "60 µs"], "answer": 3, "explanation": "슬롯형 CSMA의 백오프 값은 슬롯 크기의 정수 배이므로 20, 40, 60 µs 등만 가능하다. 1.73 ms 같은 연속값은 비슬롯형 CSMA의 예이다."}, {"q": "무선 환경에서 CSMA/CD 대신 CSMA/CA를 사용하는 이유로 옳은 것은?", "options": ["무선 채널은 대역폭이 커서 충돌이 일어나지 않기 때문", "충돌은 수신기에서 일어나고, 반이중(half duplex) 무선 장치는 전송 중 들을 수 없어 송신자가 충돌을 감지할 수 없기 때문", "무선 장치는 유선보다 전송 속도가 빨라 충돌 감지가 불필요하기 때문", "CSMA/CD는 전송 전 채널 감지를 하지 않기 때문"], "answer": 1, "explanation": "무선 송신자는 충돌을 볼 수 없으므로 DIFS, 랜덤 백오프, ACK로 충돌을 미리 회피해야 한다. CSMA/CD는 유선 이더넷에서 사용된다."}, {"q": "CSMA/CA 예시에서 노드 A는 DIFS + 4 × s, 노드 B는 DIFS + 7 × s의 백오프를 선택했다(s = 슬롯 크기). A가 먼저 전송을 시작하면 B는 타이머를 멈춘다. A의 전송이 끝나고 다시 DIFS가 지난 후 B에게 남은 백오프 슬롯 수는?", "options": ["7개", "4개", "3개", "0개"], "answer": 2, "explanation": "A가 4슬롯 후 전송을 시작할 때 B는 이미 4슬롯을 소모했으므로 타이머를 멈추고, A의 전송과 DIFS 후 남은 7 − 4 = 3슬롯으로 재개한다."}, {"q": "은닉 단말 문제(Hidden Terminal Problem)를 MACA가 해결하는 핵심 원리는?", "options": ["송신자가 전송 중에도 채널을 감지해 충돌을 탐지한다.", "수신자 B가 보낸 RTS를 듣고 C가 전송을 미룬다.", "노드들이 서로 다른 주파수 대역을 사용한다.", "수신자 B가 보낸 CTS를 은닉 노드 C도 듣고, B가 사용 중임을 알아 조용히 있는다."], "answer": 3, "explanation": "A와 C는 서로 듣지 못하지만, B가 보낸 CTS는 C도 들으므로 C가 침묵하고 A는 충돌 없이 데이터를 보낸다. 핵심은 CTS가 은닉 노드에게 경고한다는 것이다."}, {"q": "노출 단말 문제(Exposed Terminal Problem)에서 B가 A로 전송 중일 때, C가 B의 RTS는 들었지만 A의 CTS는 듣지 못했다. MACA에 따른 C의 판단으로 옳은 것은?", "options": ["B가 사용 중이므로 B → A 전송이 끝날 때까지 대기한다.", "A가 범위 밖이므로 C → D 전송을 B → A와 동시에 진행해도 안전하다.", "충돌이 발생한 것으로 판단하고 지수적 백오프를 수행한다.", "D에게 CTS를 먼저 보내 채널을 예약한다."], "answer": 1, "explanation": "RTS만 듣고 CTS를 못 들었다면 A는 C의 범위 밖이므로 C의 신호가 A의 수신을 방해하지 않아, C → D가 B → A와 병렬로 진행될 수 있다."}, {"q": "MACAW가 MACA에 추가한 두 제어 메시지와 그 메시지 교환 순서로 옳은 것은?", "options": ["ACK와 DS / RTS → CTS → DS → DATA → ACK", "ACK와 NACK / RTS → CTS → DATA → ACK → NACK", "DS와 NACK / RTS → DS → CTS → DATA → NACK", "ACK와 DS / DS → RTS → CTS → ACK → DATA"], "answer": 0, "explanation": "MACAW는 ACK(확인 응답)와 DS(Data Sending)를 추가했으며, 순서는 RTS → CTS → DS → DATA → ACK이다. RTS는 들었지만 DS가 없으면 예약 실패로 보고 다른 노드가 시도할 수 있다."}]}];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// Flatten questions with stable ids "L1-0"
const ALL = [];
LECTURES.forEach(L => L.questions.forEach((q, i) => ALL.push({ ...q, id: L.id + '-' + i, lec: L.id, lecName: L.short })));
const byId = Object.fromEntries(ALL.map(q => [q.id, q]));

let selected = new Set(store.get('isn-sel', LECTURES.map(l => l.id)));
let wrongSet = new Set(store.get('isn-wrong', []).filter(id => byId[id]));
let session = null; // {items:[{id, order:[...]}], idx, answers:{}}

$('sub').textContent = `강의자료 ${LECTURES.length}개 · 총 ${ALL.length}문항. 보기를 고르면 바로 정답과 해설이 나옵니다.`;

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'chip'; allBtn.type = 'button';
  allBtn.setAttribute('aria-pressed', selected.size === LECTURES.length);
  allBtn.innerHTML = `전체 <span class="n">${ALL.length}</span>`;
  allBtn.onclick = () => { selected = selected.size === LECTURES.length ? new Set() : new Set(LECTURES.map(l => l.id)); saveSel(); };
  box.appendChild(allBtn);
  LECTURES.forEach(L => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.setAttribute('aria-pressed', selected.has(L.id));
    b.innerHTML = `${L.short} <span class="n">${L.questions.length}</span>`;
    b.title = L.title;
    b.onclick = () => { selected.has(L.id) ? selected.delete(L.id) : selected.add(L.id); saveSel(); };
    box.appendChild(b);
  });
  $('start').disabled = selected.size === 0;
  $('wrongCount').textContent = wrongSet.size;
  $('wrongOnly').disabled = wrongSet.size === 0;
}
function saveSel() { store.set('isn-sel', [...selected]); renderChips(); }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startWith(ids) {
  if (!ids.length) return;
  if ($('shuffle').checked) ids = shuffle(ids);
  const so = $('shuffleOpt').checked;
  session = { items: ids.map(id => ({ id, order: so ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3] })), idx: 0, answers: {} };
  saveSession(); render();
}
function saveSession() { store.set('isn-session', session); }

$('start').onclick = () => startWith(ALL.filter(q => selected.has(q.lec)).map(q => q.id));
$('wrongOnly').onclick = () => startWith([...wrongSet]);

function renderMeter() {
  const bars = $('bars'); bars.innerHTML = '';
  if (!session) return;
  const n = session.items.length;
  let ok = 0, no = 0;
  session.items.forEach((it, i) => {
    const s = document.createElement('span');
    const a = session.answers[it.id];
    if (a !== undefined) { if (a === byId[it.id].answer) { s.className = 'ok'; ok++; } else { s.className = 'no'; no++; } }
    else if (i === session.idx) s.className = 'cur';
    bars.appendChild(s);
  });
  const done = session.idx >= n;
  $('pos').textContent = done ? `완료 · ${n}문항` : `${session.idx + 1} / ${n}`;
  $('tally').textContent = `정답 ${ok} · 오답 ${no}`;
}

function render() {
  renderChips(); renderMeter();
  const box = $('quiz'); box.innerHTML = '';
  if (!session) return;
  if (session.idx >= session.items.length) return renderResult(box);
  const it = session.items[session.idx];
  const q = byId[it.id];
  const picked = session.answers[it.id];
  const answered = picked !== undefined;

  const card = document.createElement('article'); card.className = 'card';
  card.innerHTML = `<div class="qmeta"><span>${esc(q.lecName)}</span><span>Q${session.idx + 1}</span></div><p class="qtext">${esc(q.q)}</p>`;
  const opts = document.createElement('div'); opts.className = 'opts';
  it.order.forEach((orig, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    b.innerHTML = `<span class="key">${k + 1}</span><span>${esc(q.options[orig])}</span>`;
    if (answered) {
      b.disabled = true;
      if (orig === q.answer) b.classList.add('correct');
      else if (orig === picked) b.classList.add('wrong');
    } else b.onclick = () => choose(orig);
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if (answered) {
    const ok = picked === q.answer;
    const ex = document.createElement('div'); ex.className = 'explain';
    const ansKey = it.order.indexOf(q.answer) + 1;
    ex.innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? '정답입니다' : `오답 · 정답은 ${ansKey}번`}</span><p>${esc(q.explanation)}</p>`;
    card.appendChild(ex);
  }
  const nav = document.createElement('div'); nav.className = 'nav';
  const prev = document.createElement('button'); prev.className = 'btn ghost'; prev.type = 'button'; prev.textContent = '이전';
  prev.disabled = session.idx === 0; prev.onclick = () => go(-1);
  const next = document.createElement('button'); next.className = 'btn'; next.type = 'button';
  next.id = 'nextBtn';
  next.textContent = session.idx === session.items.length - 1 ? '결과 보기' : (answered ? '다음 문제' : '건너뛰기');
  next.onclick = () => go(1);
  nav.append(prev, next);
  card.appendChild(nav);
  box.appendChild(card);
}

function choose(orig) {
  const it = session.items[session.idx];
  const q = byId[it.id];
  session.answers[it.id] = orig;
  if (orig === q.answer) wrongSet.delete(it.id); else wrongSet.add(it.id);
  store.set('isn-wrong', [...wrongSet]);
  saveSession(); render();
}
function go(d) {
  session.idx = Math.max(0, Math.min(session.items.length, session.idx + d));
  saveSession(); render();
  window.scrollTo({ top: $('bars').getBoundingClientRect().top + window.scrollY - 24, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

function renderResult(box) {
  const items = session.items;
  const correct = items.filter(it => session.answers[it.id] === byId[it.id].answer).length;
  const pct = Math.round(correct / items.length * 100);
  const per = {};
  items.forEach(it => {
    const q = byId[it.id];
    per[q.lec] ??= { name: q.lecName, n: 0, ok: 0 };
    per[q.lec].n++; if (session.answers[it.id] === q.answer) per[q.lec].ok++;
  });
  const wrongs = items.filter(it => session.answers[it.id] !== byId[it.id].answer);
  const el = document.createElement('article'); el.className = 'card result';
  el.innerHTML = `
    <div class="score">${correct} / ${items.length} <small>${pct}점</small></div>
    <div style="overflow-x:auto"><table><thead><tr><th>강의</th><th class="num">정답</th><th class="num">문항</th><th class="num">정답률</th></tr></thead><tbody>
      ${Object.values(per).map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.ok}</td><td class="num">${p.n}</td><td class="num">${Math.round(p.ok / p.n * 100)}%</td></tr>`).join('')}
    </tbody></table></div>`;
  const row = document.createElement('div'); row.className = 'row';
  const retry = document.createElement('button'); retry.className = 'btn'; retry.type = 'button';
  retry.textContent = `틀린 ${wrongs.length}문제 다시 풀기`; retry.disabled = !wrongs.length;
  retry.onclick = () => startWith(wrongs.map(w => w.id));
  const again = document.createElement('button'); again.className = 'btn ghost'; again.type = 'button';
  again.textContent = '같은 범위 처음부터'; again.onclick = () => startWith(items.map(i => i.id));
  row.append(retry, again); el.appendChild(row);
  if (wrongs.length) {
    const rv = document.createElement('div'); rv.className = 'review';
    rv.innerHTML = `<span class="label">틀리거나 건너뛴 문제</span>` + wrongs.map(it => {
      const q = byId[it.id]; const a = session.answers[it.id];
      return `<div class="review-item"><span class="label">${esc(q.lecName)}</span><span class="q">${esc(q.q)}</span>
        <span class="mine">내 답: ${a === undefined ? '(건너뜀)' : esc(q.options[a])}</span>
        <span class="ans">정답: ${esc(q.options[q.answer])}</span><span class="why">${esc(q.explanation)}</span></div>`;
    }).join('');
    el.appendChild(rv);
  }
  box.appendChild(el);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.addEventListener('keydown', e => {
  if (!session || session.idx >= session.items.length || e.target.tagName === 'INPUT') return;
  const it = session.items[session.idx];
  if (/^[1-4]$/.test(e.key) && session.answers[it.id] === undefined) choose(it.order[+e.key - 1]);
  else if (e.key === 'Enter' && session.answers[it.id] !== undefined) { e.preventDefault(); go(1); }
});

// Resume a saved session if it still matches the bank, else open on all lectures
const saved = store.get('isn-session', null);
if (saved && saved.items && saved.items.every(it => byId[it.id])) { session = saved; render(); }
else { renderChips(); startWith(ALL.filter(q => selected.has(q.lec)).map(q => q.id)); }
</script>
